  <text x="44" y="466" font-size="7.8" fill="#5C544A">壹 行露　道上沾濡之露</text>
  <text x="264" y="466" font-size="7.8" fill="#5C544A">贰 雀穿屋　无角而能穿，喻强</text>
  <text x="486" y="466" font-size="7.8" fill="#5C544A">叁 鼠穿墉　无牙而能啮，喻逼</text>
