<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="44" y="56" font-size="8.6" letter-spacing="2" fill="#994433">鄘风 · 七</text>
  <text x="380" y="58" text-anchor="middle" font-size="23" letter-spacing="1.6" fill="#1F1B17" font-weight="700">蝃蝀在东，朝隮于西</text>
  <text x="716" y="56" text-anchor="end" font-size="8.2" letter-spacing="1.5" fill="#9A9186">诗三百五篇 · 之五十一</text>
  <text x="380" y="78" text-anchor="middle" font-size="8.2" letter-spacing="1.2" fill="#7C6D5C">虹：天地之淫气 · 朝西暮东</text>
  <line x1="44" y1="96" x2="716" y2="96" stroke="#9A9186" stroke-width="0.8"/>

  <!-- 东虹 -->
  <rect x="44" y="116" width="316" height="286" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="66" y="142" font-size="8.6" letter-spacing="1.5" fill="#994433">壹　蝃蝀在东</text>
  <line x1="70" y1="330" x2="334" y2="330" stroke="#7C6D5C" stroke-width="1"/>
  <g fill="none" stroke-width="5">
    <path d="M76,330 A124,124 0 0 1 324,330" stroke="#994433"/>
    <path d="M86,330 A114,114 0 0 1 314,330" stroke="#C07A4A"/>
    <path d="M96,330 A104,104 0 0 1 304,330" stroke="#B9975B"/>
    <path d="M106,330 A94,94 0 0 1 294,330" stroke="#7C8B6B"/>
    <path d="M116,330 A84,84 0 0 1 284,330" stroke="#6E7F8D"/>
    <path d="M126,330 A74,74 0 0 1 274,330" stroke="#7C6D5C"/>
  </g>
  <text x="200" y="348" text-anchor="middle" font-size="7.2" fill="#994433">东</text>
  <text x="200" y="366" text-anchor="middle" font-size="6.2" fill="#7C6D5C">暮虹在东，人莫敢指</text>

  <text x="300" y="388" text-anchor="middle" font-size="7.4" fill="#994433">莫之敢指</text>

  <!-- 西虹 -->
  <rect x="400" y="116" width="316" height="286" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="422" y="142" font-size="8.6" letter-spacing="1.5" fill="#994433">贰　朝隮于西</text>
  <line x1="426" y1="330" x2="690" y2="330" stroke="#7C6D5C" stroke-width="1"/>
  <g fill="none" stroke-width="5">
    <path d="M432,330 A124,124 0 0 1 680,330" stroke="#994433"/>
    <path d="M442,330 A114,114 0 0 1 670,330" stroke="#C07A4A"/>
    <path d="M452,330 A104,104 0 0 1 660,330" stroke="#B9975B"/>
    <path d="M462,330 A94,94 0 0 1 650,330" stroke="#7C8B6B"/>
    <path d="M472,330 A84,84 0 0 1 640,330" stroke="#6E7F8D"/>
    <path d="M482,330 A74,74 0 0 1 630,330" stroke="#7C6D5C"/>
  </g>
  <text x="558" y="348" text-anchor="middle" font-size="7.2" fill="#994433">西</text>

  <!-- 雨 -->
  <g stroke="#6E7F8D" stroke-width="0.8" opacity="0.8">
    <line x1="470" y1="360" x2="464" y2="378"/><line x1="500" y1="356" x2="494" y2="374"/>
    <line x1="530" y1="362" x2="524" y2="380"/><line x1="560" y1="356" x2="554" y2="374"/>
    <line x1="590" y1="362" x2="584" y2="380"/><line x1="620" y1="358" x2="614" y2="376"/>
    <line x1="650" y1="362" x2="644" y2="380"/>
  </g>
  <text x="558" y="380" text-anchor="middle" font-size="7.4" fill="#994433">崇朝其雨</text>
  <text x="558" y="398" text-anchor="middle" font-size="6" fill="#7C6D5C">虹能藏雨；淫气害阴阳之和</text>

  <line x1="44" y1="420" x2="716" y2="420" stroke="#9A9186" stroke-width="0.8"/>
  <text x="380" y="450" text-anchor="middle" font-size="14" letter-spacing="1.2" fill="#1F1B17">蝃蝀在东，莫之敢指；朝隮于西，崇朝其雨</text>
  <text x="380" y="470" text-anchor="middle" font-size="7.6" letter-spacing="1" fill="#7C6D5C">虹随日所映，故朝西而莫东；人随礼所绳，故奔者不齿</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">蝃蝀 · 虹 · 天地之淫气</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图一 · 名物 · sj051a</text>
</svg>
