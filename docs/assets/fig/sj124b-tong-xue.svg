<text x="226.0" y="178.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">葛生蒙楚，蔹蔓于野</text>
<text x="566.0" y="178.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">野</text>
<line x1="44.0" y1="262.0" x2="716.0" y2="262.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="240.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">独息</text>
<text x="226.0" y="240.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">葛生蒙棘，蔹蔓于域</text>
<text x="566.0" y="240.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">墓</text>
<line x1="44.0" y1="324.0" x2="716.0" y2="324.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="302.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">独旦</text>
<text x="226.0" y="302.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">角枕粲兮，锦衾烂兮</text>
<text x="566.0" y="302.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">夜</text>
<line x1="44.0" y1="386.0" x2="716.0" y2="386.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
