<line x1="544.0" y1="378.0" x2="552.0" y2="378.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<line x1="50.0" y1="392.0" x2="710.0" y2="392.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="418.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.6" fill="#A63D2F" text-anchor="middle" font-weight="bold" letter-spacing="0.6">草木有托，所美无归；生不能同处，死乃誓同穴</text>
<text x="380.0" y="442.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="0.3">圹只画轮廓，不画墓中人；倒章往复，不作错简读。</text>
<text x="380.0" y="486.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="0.0">图二 · 义理</text>
