<text x="38.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.5" fill="#A63D2F" text-anchor="start" font-weight="normal" letter-spacing="2.0">郑 风 · 之十</text>
<text x="380.0" y="72.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="26.0" fill="#1F1B17" text-anchor="middle" font-weight="bold" letter-spacing="2.0">山有扶苏　所美非美</text>
<text x="720.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#7C6D5C" text-anchor="end" font-weight="normal" letter-spacing="1.0">诗三百五篇 · 之八四</text>
<line x1="38.0" y1="100.0" x2="722.0" y2="100.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="122.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.2" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="1.0">物各得所，人却错位</text>
<line x1="44.0" y1="196.0" x2="716.0" y2="196.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="64.0" y="176.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.5" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">山</text>
<text x="236.0" y="176.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.2" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">扶苏 · 乔松</text>
<text x="566.0" y="176.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.6" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">高者高</text>
<line x1="44.0" y1="266.0" x2="716.0" y2="266.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="64.0" y="246.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.5" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">隰</text>
<text x="236.0" y="246.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.2" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">荷华 · 龙游</text>
<text x="566.0" y="246.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.6" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">下者下</text>
<line x1="44.0" y1="336.0" x2="716.0" y2="336.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="64.0" y="316.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.5" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">人</text>
<text x="236.0" y="316.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.2" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">不见子都，乃见狂且</text>
<text x="566.0" y="316.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.6" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">所见非想</text>
