<line x1="50.0" y1="388.0" x2="710.0" y2="388.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="414.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="12.2" fill="#A63D2F" text-anchor="middle" font-weight="bold" letter-spacing="1.0">所美非美，所见非想</text>
<text x="380.0" y="438.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.0" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="0.5">一句“乃见”，把理想拉回眼前。</text>
<text x="380.0" y="468.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="0.0">图二 · 义理</text>
