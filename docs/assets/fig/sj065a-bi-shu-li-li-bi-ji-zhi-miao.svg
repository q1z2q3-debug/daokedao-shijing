  </g>
  <text x="142" y="334" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.2" fill="#994433">黍 · 离离（垂）</text>

  <!-- right field: millet (ji) upright -->
  <g>
    <path d="M556 300 L556 244" stroke="#5F7269" stroke-width="1.4"/>
    <path d="M556 274 Q542 264 536 252 M556 286 Q572 278 578 266" stroke="#8FA39A" stroke-width="1"/>
