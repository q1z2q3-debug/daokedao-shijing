    <path d="M160 268 L172 282" stroke="#25211D" stroke-width="3"/>
    <path d="M142 296 L140 310 M164 296 L166 310" stroke="#1F1B17" stroke-width="1.6"/>
    <path d="M174 292 L174 248" stroke="#7C6D5C" stroke-width="1.6"/>
  </g>
  <text x="154" y="318" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.8" fill="#7C6D5C">行迈靡靡</text>

  <!-- bottom -->
  <line x1="40" y1="366" x2="720" y2="366" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="380" y="390" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.6" fill="#1F1B17">彼黍离离，彼稷之苗。行迈靡靡，中心摇摇。</text>
  <text x="380" y="416" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#7C6D5C">知我者，谓我心忧；不知我者，谓我何求。</text>
  <text x="380" y="444" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.2" fill="#994433" letter-spacing="1">悠悠苍天，此何人哉？</text>
  <text x="380" y="468" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">黍离之悲：不是离愁，是亡国之思</text>

  <text x="724" y="522" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">图一 · 黍离 · sj065a</text>
</svg>
