  <rect x="288" y="204" width="224" height="106" fill="none" stroke="#994433" stroke-width="0.7" stroke-dasharray="4 3"/>
  <text x="400" y="198" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.8" fill="#994433">故宗庙宫室</text>
  <text x="400" y="320" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#994433">尽为禾黍</text>

  <!-- traveler -->
  <g>
    <circle cx="154" cy="252" r="9" fill="none" stroke="#1F1B17" stroke-width="1.1"/>
    <path d="M145 252 Q143 245 150 242 Q154 239 159 242 Q165 245 163 252" fill="#1F1B17" opacity="0.55"/>
    <path d="M154 261 Q142 274 140 296 L166 296 Q164 274 160 261 Z" fill="#25211D"/>
