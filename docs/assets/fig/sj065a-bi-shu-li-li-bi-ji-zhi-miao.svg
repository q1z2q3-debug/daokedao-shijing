  <text x="610" y="334" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.2" fill="#5F7269">稷 · 苗</text>

  <!-- ruins of ancestral temple -->
  <g>
    <path d="M292 304 L292 286 L508 286 L508 304 Z" fill="#DCD5C8" stroke="#9A9186" stroke-width="0.8"/>
