<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="44" y="56" font-size="8.6" letter-spacing="2" fill="#994433">鄘风 · 十</text>
  <text x="380" y="58" text-anchor="middle" font-size="25" letter-spacing="1.4" fill="#1F1B17" font-weight="700">礼拦不住，行胜于思</text>
  <text x="716" y="56" text-anchor="end" font-size="8.2" letter-spacing="1.5" fill="#9A9186">诗三百五篇 · 之五十四</text>
  <text x="380" y="78" text-anchor="middle" font-size="8.2" letter-spacing="1.2" fill="#7C6D5C">《诗经》鄘风 · 第十篇　载驰</text>
  <line x1="44" y1="96" x2="716" y2="96" stroke="#9A9186" stroke-width="0.8"/>

  <!-- wall -->
  <rect x="184" y="166" width="30" height="224" fill="#EADFCA" stroke="#5C544A" stroke-width="1"/>
  <g stroke="#9A9186" stroke-width="0.5">
    <line x1="184" y1="196" x2="214" y2="196"/><line x1="184" y1="226" x2="214" y2="226"/>
    <line x1="184" y1="256" x2="214" y2="256"/><line x1="184" y1="286" x2="214" y2="286"/>
    <line x1="184" y1="316" x2="214" y2="316"/><line x1="184" y1="346" x2="214" y2="346"/>
    <line x1="199" y1="166" x2="199" y2="196"/><line x1="199" y1="226" x2="199" y2="256"/>
    <line x1="199" y1="286" x2="199" y2="316"/><line x1="199" y1="346" x2="199" y2="376"/>
  </g>
  <text x="199" y="152" text-anchor="middle" font-size="10" fill="#994433" font-weight="700">礼</text>
  <text x="160" y="280" transform="rotate(-90 160 280)" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#7C6D5C">妇人不出境</text>

  <!-- opening: path breaks through the ritual wall -->
  <rect x="186" y="350" width="26" height="30" fill="#F7F4EE" stroke="none"/>
  <path d="M186,350 L192,360 L186,370 M212,350 L206,360 L212,370" fill="none" stroke="#994433" stroke-width="0.7"/>

  <!-- path -->
  <path d="M80,392 L150,392 C170,392 176,380 184,360 C196,330 210,330 232,330 L270,330 C300,330 316,316 336,300 L382,272 C402,258 420,250 446,244 L500,228 C520,222 540,216 560,210 L620,194" fill="none" stroke="#994433" stroke-width="1.6" stroke-dasharray="8 6"/>
  <path d="M620,194 L608,190 M620,194 L610,200" fill="#994433"/>

  <!-- node 1 -->
  <circle cx="118" cy="392" r="4.5" fill="#994433"/>
  <text x="118" y="414" text-anchor="middle" font-size="6.4" fill="#1F1B17">驰驱归唁</text>
  <text x="118" y="426" text-anchor="middle" font-size="5.6" fill="#9A9186">首章</text>

  <!-- node 2 -->
  <circle cx="270" cy="330" r="4.5" fill="#994433"/>
  <text x="270" y="350" text-anchor="middle" font-size="6.4" fill="#1F1B17">许人尤之</text>
  <text x="270" y="362" text-anchor="middle" font-size="5.6" fill="#9A9186">二、三章</text>

  <!-- node 3 -->
  <circle cx="382" cy="272" r="4.5" fill="#994433"/>
  <text x="382" y="292" text-anchor="middle" font-size="6.4" fill="#1F1B17">陟丘采蝱</text>
  <text x="382" y="304" text-anchor="middle" font-size="5.6" fill="#9A9186">四章</text>

  <!-- node 4 -->
  <circle cx="520" cy="222" r="4.5" fill="#994433"/>
  <text x="520" y="242" text-anchor="middle" font-size="6.4" fill="#1F1B17">行野麦芃</text>
  <text x="520" y="254" text-anchor="middle" font-size="5.6" fill="#9A9186">卒章</text>

  <!-- node 5 -->
  <circle cx="620" cy="194" r="4.5" fill="#994433"/>
  <text x="642" y="192" font-size="6.6" fill="#994433">控于大邦</text>

  <line x1="44" y1="438" x2="716" y2="438" stroke="#9A9186" stroke-width="0.8"/>
  <text x="380" y="466" text-anchor="middle" font-size="18" letter-spacing="1.6" fill="#1F1B17">百尔所思，不如我所之</text>
  <text x="380" y="486" text-anchor="middle" font-size="7.2" letter-spacing="0.8" fill="#7C6D5C">礼法说「妇人不出境」，她说「我行其野」</text>

  <text x="44" y="516" font-size="6.2" fill="#9A9186">载驰 · 五章行程</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图二 · 义理 · sj054b</text>
</svg>
