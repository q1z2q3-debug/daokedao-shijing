<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Noto Serif SC,Songti SC,serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-size="21" letter-spacing="8" fill="#1F1B17" font-weight="700">自問 · 留役 · 不叛</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.6" letter-spacing="2" fill="#5C544A">《诗经》邶风 · 第十一篇　式微</text>
  <defs><marker id="ar16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#994433"/></marker></defs>
  <rect x="70" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="145" y="214" text-anchor="middle" font-size="28" letter-spacing="2" fill="#5C544A" font-weight="700">自問</text>
  <text x="145" y="252" text-anchor="middle" font-size="10" fill="#3B352F">胡不歸</text>
  <text x="145" y="278" text-anchor="middle" font-size="8" fill="#9A9186">归念起矣</text>
  <rect x="290" y="150" width="150" height="150" fill="#FCFAF6" stroke="#994433" stroke-width="1.1"/>
  <text x="365" y="214" text-anchor="middle" font-size="28" letter-spacing="2" fill="#994433" font-weight="700">留役</text>
  <text x="365" y="252" text-anchor="middle" font-size="10" fill="#3B352F">微君之故</text>
  <text x="365" y="278" text-anchor="middle" font-size="8" fill="#9A9186">为君而留</text>
  <rect x="510" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="585" y="214" text-anchor="middle" font-size="28" letter-spacing="2" fill="#5C544A" font-weight="700">不叛</text>
  <text x="585" y="252" text-anchor="middle" font-size="10" fill="#3B352F">怨而尽职</text>
  <text x="585" y="278" text-anchor="middle" font-size="8" fill="#9A9186">不背其事</text>
  <line x1="220" y1="225" x2="288" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar16)"/>
  <line x1="440" y1="225" x2="508" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar16)"/>
  <text x="380" y="330" text-anchor="middle" font-size="8.4" fill="#5C544A">若非为君之故，何至于露中泥中；怨是自问，不是颂，亦不是叛</text>
  <line x1="120" y1="360" x2="640" y2="360" stroke="#9A9186" stroke-width="0.8"/>
  <text x="230" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">微</text>
  <text x="230" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">若非，微君之故</text>
  <text x="530" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">躬</text>
  <text x="530" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">身也，微君之躬</text>
  <text x="380" y="446" text-anchor="middle" font-size="7.4" fill="#9A9186">《邶风·式微》「微君之故，胡为乎中露」「微君之躬，胡为乎泥中」</text>
  <text x="120" y="512" font-size="5.6" fill="#5C544A">诗经 · 邶风</text>
  <text x="640" y="512" text-anchor="end" font-size="5.6" fill="#5C544A">图二 · 自问留役不叛 · sj036b</text>
</svg>