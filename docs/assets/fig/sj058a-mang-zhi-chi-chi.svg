  <path d="M300,150 C330,170 350,160 370,190 C390,220 360,240 350,260 C340,280 370,300 400,320 C420,332 440,330 460,340" fill="none" stroke="#9A9186" stroke-width="1.4"/>
  <path d="M306,156 C336,176 356,166 376,196 C396,226 366,246 356,266 C346,286 376,306 406,326 C426,338 446,336 466,346" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="306" y="172" font-size="5.4" fill="#7C6D5C" transform="rotate(18 306 172)">淇水</text>
  <!-- Dunqiu mound -->
  <path d="M392,178 C400,166 416,166 424,178 L424,184 L392,184 Z" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <text x="430" y="180" font-size="5.8" fill="#1F1B17">顿丘</text>
  <!-- Fuguan gate -->
  <path d="M326,236 L326,258 L350,258 L350,236" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <path d="M322,236 L338,224 L354,236" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <line x1="338" y1="224" x2="338" y2="258" stroke="#7C6D5C" stroke-width="0.5"/>
  <text x="358" y="248" font-size="5.8" fill="#1F1B17">复关</text>
  <!-- ruined wall -->
  <path d="M392,314 L392,340 L448,340 L448,314 L438,314 L438,322 L428,322 L428,314 L418,314 L418,322 L408,322 L408,314 L398,314 L398,322 L392,322 Z" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <text x="392" y="356" font-size="5.8" fill="#1F1B17">毁墙</text>
  <!-- arrows/labels -->
  <text x="286" y="210" font-size="5.4" fill="#994433">送子涉淇</text>
  <path d="M310,214 L334,214" fill="none" stroke="#994433" stroke-width="0.6"/>
  <path d="M334,214 L328,211 M334,214 L328,217" fill="none" stroke="#994433" stroke-width="0.6"/>
  <text x="354" y="292" font-size="5.4" fill="#994433">以望复关</text>
  <text x="430" y="312" font-size="5.4" fill="#994433">以尔车来</text>

  <!-- right panel: mulberry and dove -->
  <rect x="506" y="116" width="210" height="248" fill="#F2EFE6" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="518" y="136" font-size="7.4" fill="#994433" font-weight="700">桑与鸠</text>
  <!-- branch -->
  <path d="M520,310 C560,290 590,300 630,270 C660,250 680,250 700,240" fill="none" stroke="#5C544A" stroke-width="1.1"/>
