  <g fill="#7C8A5E" stroke="#5C544A" stroke-width="0.5">
    <path d="M552,292 C540,276 548,258 566,254 C570,270 566,286 552,292 Z"/>
    <path d="M596,286 C584,270 592,252 610,248 C614,264 610,280 596,286 Z"/>
    <path d="M642,264 C630,248 638,230 656,226 C660,242 656,258 642,264 Z"/>
    <path d="M678,252 C666,236 674,218 692,214 C696,230 692,246 678,252 Z"/>
  </g>
  <!-- yellow falling leaves -->
  <g fill="#C9A35C" stroke="#9A9186" stroke-width="0.5">
    <path d="M570,300 C558,314 544,318 536,310 C540,296 554,290 570,300 Z"/>
    <path d="M620,292 C608,306 594,310 586,302 C590,288 604,282 620,292 Z"/>
    <path d="M660,286 C648,300 634,304 626,296 C630,282 644,276 660,286 Z"/>
  </g>
  <!-- dove -->
  <path d="M610,244 C618,232 632,230 640,240 C646,248 642,258 632,260 C622,262 612,256 610,244 Z" fill="none" stroke="#5C544A" stroke-width="0.9"/>
  <path d="M640,240 C648,236 654,238 656,244" fill="none" stroke="#5C544A" stroke-width="0.7"/>
  <circle cx="634" cy="242" r="0.9" fill="#1F1B17"/>
  <!-- berries -->
  <g fill="#994433">
    <circle cx="600" cy="258" r="1.8"/><circle cx="606" cy="264" r="1.8"/><circle cx="596" cy="266" r="1.8"/>
  </g>
  <text x="518" y="330" font-size="5.6" fill="#7C6D5C">桑之未落，其叶沃若</text>
  <text x="518" y="344" font-size="5.6" fill="#7C6D5C">桑之落矣，其黄而陨</text>
  <text x="518" y="358" font-size="5.4" fill="#994433">鸠食葚则醉，女耽则伤</text>

  <!-- bottom strip -->
  <line x1="44" y1="378" x2="716" y2="378" stroke="#9A9186" stroke-width="0.7"/>
  <text x="44" y="396" font-size="7.2" fill="#994433" font-weight="700">总角之宴，言笑晏晏</text>
  <text x="44" y="412" font-size="5.6" fill="#7C6D5C">总角：女子未许嫁、未笄，结发为饰；童年少年时。</text>
  <!-- two child heads with buns -->
  <g fill="none" stroke="#5C544A" stroke-width="0.8">
    <circle cx="530" cy="430" r="9"/>
    <path d="M521,426 C523,416 537,416 539,426"/>
    <circle cx="526" cy="416" r="4"/>
    <circle cx="586" cy="430" r="9"/>
    <path d="M577,426 C579,416 593,416 595,426"/>
    <circle cx="582" cy="416" r="4"/>
  </g>
  <text x="512" y="454" font-size="5.4" fill="#7C6D5C">总角</text>
  <!-- broken oath tablet -->
  <rect x="630" y="416" width="28" height="26" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <path d="M644,416 L640,442" fill="none" stroke="#994433" stroke-width="0.8"/>
  <path d="M640,428 L636,424 M640,428 L644,424" fill="none" stroke="#994433" stroke-width="0.5"/>
  <text x="626" y="456" font-size="5.4" fill="#994433">信誓旦旦，不思其反</text>

  <text x="380" y="484" text-anchor="middle" font-size="8.2" fill="#7C6D5C">来时以尔车来，去时渐车帷裳</text>
  <text x="380" y="500" text-anchor="middle" font-size="5.8" fill="#9A9186">同一辆车，两个方向</text>

  <text x="44" y="516" font-size="6.2" fill="#9A9186">氓 · 六章章十句</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图一 · 名物 · sj058a</text>
</svg>
