  <rect x="130" y="258" width="50" height="6" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <line x1="136" y1="264" x2="136" y2="280" stroke="#5C544A" stroke-width="0.7"/>
  <line x1="174" y1="264" x2="174" y2="280" stroke="#5C544A" stroke-width="0.7"/>
  <text x="56" y="348" font-size="5.8" fill="#7C6D5C">匪来贸丝，来即我谋</text>

  <!-- center panel: Qi river route -->
  <rect x="270" y="116" width="216" height="248" fill="#F2EFE6" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="282" y="136" font-size="7.4" fill="#994433" font-weight="700">淇水一线</text>
