  <circle cx="172" cy="228" r="10" fill="none" stroke="#7C6D5C" stroke-width="0.8"/>
  <circle cx="172" cy="228" r="5" fill="none" stroke="#7C6D5C" stroke-width="0.5"/>
  <line x1="162" y1="228" x2="182" y2="228" stroke="#7C6D5C" stroke-width="0.4"/>
  <line x1="172" y1="218" x2="172" y2="238" stroke="#7C6D5C" stroke-width="0.4"/>
  <text x="184" y="232" font-size="5.8" fill="#7C6D5C">丝</text>
