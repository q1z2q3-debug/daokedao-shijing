<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="380" y="50" text-anchor="middle" font-size="19" letter-spacing="2.4" fill="#1F1B17" font-weight="700">复国之序：先定，后建，再富</text>
  <text x="380" y="72" text-anchor="middle" font-size="9.2" letter-spacing="2" fill="#5C544A">《诗经》鄘风 · 第六篇　定之方中</text>
  <line x1="44" y1="92" x2="716" y2="92" stroke="#9A9186" stroke-width="0.8"/>

  <text x="52" y="116" font-size="8" letter-spacing="1.5" fill="#994433">一章 · 营宫室</text>
  <text x="300" y="116" font-size="8" letter-spacing="1.5" fill="#994433">二章 · 择地卜吉</text>
  <text x="540" y="116" font-size="8" letter-spacing="1.5" fill="#994433">三章 · 农桑马政</text>
  <line x1="52" y1="124" x2="280" y2="124" stroke="#DCD5C8" stroke-width="0.6"/>
  <line x1="300" y1="124" x2="484" y2="124" stroke="#DCD5C8" stroke-width="0.6"/>
  <line x1="540" y1="124" x2="716" y2="124" stroke="#DCD5C8" stroke-width="0.6"/>

  <!-- 8 nodes -->
  <g>
    <!-- 1 定星 -->
    <rect x="36" y="142" width="78" height="98" fill="#F2E7D5" stroke="#994433" stroke-width="0.9"/>
    <text x="75" y="164" text-anchor="middle" font-size="11" fill="#994433" font-weight="700">定星</text>
    <text x="75" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">时</text>
    <text x="75" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">营室昏中</text>
    <text x="75" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">夏正十月</text>

    <!-- 2 揆日 -->
    <rect x="126" y="142" width="78" height="98" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
    <text x="165" y="164" text-anchor="middle" font-size="11" fill="#1F1B17" font-weight="700">揆日</text>
    <text x="165" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">方</text>
    <text x="165" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">测日影</text>
    <text x="165" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">定东西南北</text>

    <!-- 3 树艺 -->
    <rect x="216" y="142" width="78" height="98" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
    <text x="255" y="164" text-anchor="middle" font-size="11" fill="#1F1B17" font-weight="700">树艺</text>
    <text x="255" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">材</text>
    <text x="255" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">榛栗椅桐</text>
    <text x="255" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">梓漆 · 备琴瑟</text>

    <!-- 4 望楚 -->
    <rect x="306" y="142" width="78" height="98" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
    <text x="345" y="164" text-anchor="middle" font-size="11" fill="#1F1B17" font-weight="700">望楚</text>
    <text x="345" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">地</text>
    <text x="345" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">升虚 · 降桑</text>
    <text x="345" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">楚丘 / 堂 / 京</text>

    <!-- 5 卜吉 -->
    <rect x="396" y="142" width="78" height="98" fill="#F2E7D5" stroke="#994433" stroke-width="0.9"/>
    <text x="435" y="164" text-anchor="middle" font-size="11" fill="#994433" font-weight="700">卜吉</text>
    <text x="435" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">验</text>
    <text x="435" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">终然允臧</text>
    <text x="435" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">建国必卜</text>

    <!-- 6 灵雨 -->
    <rect x="486" y="142" width="78" height="98" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
    <text x="525" y="164" text-anchor="middle" font-size="11" fill="#1F1B17" font-weight="700">灵雨</text>
    <text x="525" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">农</text>
    <text x="525" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">星言夙驾</text>
    <text x="525" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">命彼倌人</text>

    <!-- 7 桑田 -->
    <rect x="576" y="142" width="78" height="98" fill="#F2E7D5" stroke="#994433" stroke-width="0.9"/>
    <text x="615" y="164" text-anchor="middle" font-size="11" fill="#994433" font-weight="700">桑田</text>
    <text x="615" y="180" text-anchor="middle" font-size="6.6" fill="#7C6D5C">食</text>
    <text x="615" y="208" text-anchor="middle" font-size="6.2" fill="#1F1B17">说于桑田</text>
    <text x="615" y="222" text-anchor="middle" font-size="5.6" fill="#9A9186">劝民稼穑</text>

    <!-- 8 马政 -->
    <rect x="666" y="142" width="58" height="98" fill="#F2E7D5" stroke="#994433" stroke-width="0.9"/>
    <text x="695" y="164" text-anchor="middle" font-size="10" fill="#994433" font-weight="700">马政</text>
    <text x="695" y="180" text-anchor="middle" font-size="6.2" fill="#7C6D5C">强</text>
    <text x="695" y="208" text-anchor="middle" font-size="6" fill="#1F1B17">騋牝三千</text>
    <text x="695" y="222" text-anchor="middle" font-size="5.4" fill="#9A9186">国富</text>
  </g>

  <!-- arrows -->
  <g stroke="#994433" stroke-width="1.2" fill="none">
    <path d="M114,190 L122,190 M116,186 L122,190 L116,194"/>
    <path d="M204,190 L212,190 M206,186 L212,190 L206,194"/>
    <path d="M294,190 L302,190 M296,186 L302,190 L296,194"/>
    <path d="M384,190 L392,190 M386,186 L392,190 L386,194"/>
    <path d="M474,190 L482,190 M476,186 L482,190 L476,194"/>
    <path d="M564,190 L572,190 M566,186 L572,190 L566,194"/>
    <path d="M654,190 L662,190 M656,186 L662,190 L656,194"/>
  </g>

  <text x="380" y="270" text-anchor="middle" font-size="7.6" fill="#994433">得其时制：定星 · 揆日 · 卜吉</text>
  <text x="380" y="287" text-anchor="middle" font-size="6.4" fill="#9A9186">不是先富后建，是先定后建；不是先建后农，是先农后强</text>

  <rect x="80" y="312" width="600" height="42" fill="#F2E7D5" stroke="#D8CBB8" stroke-width="0.8"/>
  <text x="380" y="330" text-anchor="middle" font-size="8.4" letter-spacing="1.2" fill="#994433">秉心塞渊：全诗主脑</text>
  <text x="380" y="346" text-anchor="middle" font-size="6.2" fill="#7C6D5C">匪直也人，秉心塞渊；騋牝三千</text>

  <text x="380" y="382" text-anchor="middle" font-size="8.2" fill="#1F1B17">一章营宫室　二章择地卜吉　三章农桑马政</text>
  <text x="380" y="402" text-anchor="middle" font-size="6.4" fill="#9A9186">美在得其时制，不在夸富</text>

  <line x1="44" y1="424" x2="716" y2="424" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="380" y="452" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#1F1B17">定之方中，作于楚宫；揆之以日，作于楚室</text>
  <text x="380" y="474" text-anchor="middle" font-size="7" fill="#7C6D5C">先量地，后立宫；先种树，后取琴瑟</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">鄘风 · 定之方中</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图二 · 复国之序 · sj050b</text>
</svg>
