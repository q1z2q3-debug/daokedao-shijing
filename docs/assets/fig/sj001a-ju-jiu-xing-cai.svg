  <text x="612" y="430" text-anchor="middle" font-size="9" fill="#4A5C55">荇菜　圆叶细茎，浮水而生，可荐为菹</text>
  <text x="612" y="444" text-anchor="middle" font-size="7.6" fill="#7C6D5C">「参差荇菜，左右流之」</text>
