<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="44" y="56" font-size="8.6" letter-spacing="2" fill="#994433">鄘风 · 八</text>
  <text x="380" y="58" text-anchor="middle" font-size="24" letter-spacing="1.6" fill="#1F1B17" font-weight="700">相鼠有皮，有齿，有体</text>
  <text x="716" y="56" text-anchor="end" font-size="8.2" letter-spacing="1.5" fill="#9A9186">诗三百五篇 · 之五十二</text>
  <text x="380" y="78" text-anchor="middle" font-size="8.2" letter-spacing="1.2" fill="#7C6D5C">鼠之三有：皮、齿、支体</text>
  <line x1="44" y1="96" x2="716" y2="96" stroke="#9A9186" stroke-width="0.8"/>

  <!-- 皮：鼠侧身，皮毛 -->
  <rect x="44" y="120" width="206" height="260" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="64" y="148" font-size="8.6" letter-spacing="1.4" fill="#994433">壹　皮</text>
  <line x1="64" y1="318" x2="230" y2="318" stroke="#7C6D5C" stroke-width="0.8"/>
  <g>
    <!-- body -->
    <ellipse cx="128" cy="266" rx="40" ry="22" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.9"/>
    <!-- head -->
    <ellipse cx="174" cy="246" rx="20" ry="17" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.9"/>
    <!-- ears -->
    <circle cx="164" cy="228" r="9" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.7"/>
    <circle cx="186" cy="228" r="9" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.7"/>
    <circle cx="164" cy="228" r="4.5" fill="#E8DCC8"/>
    <circle cx="186" cy="228" r="4.5" fill="#E8DCC8"/>
    <!-- snout & nose -->
    <path d="M188,246 L200,249 L188,252 Z" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.6"/>
    <circle cx="199" cy="249" r="2" fill="#1F1B17"/>
    <circle cx="177" cy="242" r="1.9" fill="#1F1B17"/>
    <!-- whiskers -->
    <path d="M196,251 L212,247 M196,253 L212,255" stroke="#7C6D5C" stroke-width="0.4"/>
    <!-- tail -->
    <path d="M88,270 C64,278 58,296 44,294" fill="none" stroke="#7C6D5C" stroke-width="1"/>
    <!-- legs -->
    <path d="M112,286 L112,308 M140,286 L140,308" stroke="#7C6D5C" stroke-width="0.8"/>
    <path d="M106,308 L118,308 M134,308 L146,308" stroke="#7C6D5C" stroke-width="0.6"/>
    <!-- fur -->
    <g stroke="#7C6D5C" stroke-width="0.45" opacity="0.55">
      <path d="M102,258 L98,264 M110,254 L106,260 M118,258 L114,264 M126,254 L122,260 M134,258 L130,264 M142,254 L138,260 M150,258 L146,264"/>
    </g>
  </g>
  <text x="147" y="338" text-anchor="middle" font-size="7.2" fill="#994433">皮：皮毛</text>
  <text x="147" y="354" text-anchor="middle" font-size="6" fill="#7C6D5C">鼠尚有皮，人可无仪？</text>

  <!-- 齿：鼠头，门齿 -->
  <rect x="277" y="120" width="206" height="260" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="297" y="148" font-size="8.6" letter-spacing="1.4" fill="#994433">贰　齿</text>
  <g>
    <circle cx="380" cy="248" r="27" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.9"/>
    <circle cx="357" cy="226" r="13" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.7"/>
    <circle cx="403" cy="226" r="13" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.7"/>
    <circle cx="357" cy="226" r="7" fill="#E8DCC8"/>
    <circle cx="403" cy="226" r="7" fill="#E8DCC8"/>
    <circle cx="371" cy="242" r="2.2" fill="#1F1B17"/><circle cx="389" cy="242" r="2.2" fill="#1F1B17"/>
    <path d="M380,254 L392,258 L380,262 Z" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.5"/>
    <circle cx="392" cy="258" r="1.8" fill="#1F1B17"/>
    <!-- incisors -->
    <path d="M370,266 L370,282 L376,282 L376,266 Z" fill="#FCFAF6" stroke="#1F1B17" stroke-width="0.6"/>
    <path d="M384,266 L384,282 L390,282 L390,266 Z" fill="#FCFAF6" stroke="#1F1B17" stroke-width="0.6"/>
    <path d="M380,266 L380,280" stroke="#9A9186" stroke-width="0.4"/>
    <!-- whiskers -->
    <path d="M352,256 L332,252 M352,260 L332,264 M408,256 L428,252 M408,260 L428,264" stroke="#7C6D5C" stroke-width="0.4"/>
  </g>
  <text x="380" y="338" text-anchor="middle" font-size="7.2" fill="#994433">齿：牙齿</text>
  <text x="380" y="354" text-anchor="middle" font-size="6" fill="#7C6D5C">鼠尚有齿，人可无止？</text>

  <!-- 体：全鼠，肢体 -->
  <rect x="510" y="120" width="206" height="260" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="530" y="148" font-size="8.6" letter-spacing="1.4" fill="#994433">叁　体</text>
  <line x1="530" y1="318" x2="696" y2="318" stroke="#7C6D5C" stroke-width="0.8"/>
  <g>
    <ellipse cx="596" cy="262" rx="38" ry="22" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.9"/>
    <ellipse cx="638" cy="242" rx="18" ry="16" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.9"/>
    <circle cx="630" cy="224" r="9" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.7"/>
    <circle cx="650" cy="224" r="9" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.7"/>
    <circle cx="630" cy="224" r="4.5" fill="#E8DCC8"/><circle cx="650" cy="224" r="4.5" fill="#E8DCC8"/>
    <path d="M652,242 L664,246 L652,250 Z" fill="#E8DCC8" stroke="#7C6D5C" stroke-width="0.6"/>
    <circle cx="663" cy="246" r="2" fill="#1F1B17"/>
    <circle cx="644" cy="238" r="1.8" fill="#1F1B17"/>
    <path d="M600,280 L600,306 M616,280 L616,306 M636,280 L636,306" stroke="#7C6D5C" stroke-width="0.8"/>
    <path d="M594,306 L606,306 M610,306 L622,306 M630,306 L642,306" stroke="#7C6D5C" stroke-width="0.6"/>
    <path d="M560,266 C536,276 530,296 516,294" fill="none" stroke="#7C6D5C" stroke-width="1"/>
  </g>
  <text x="610" y="338" text-anchor="middle" font-size="7.2" fill="#994433">体：支体（肢体）</text>
  <text x="610" y="354" text-anchor="middle" font-size="6" fill="#7C6D5C">鼠尚有体，人可无礼？</text>

  <line x1="44" y1="398" x2="716" y2="398" stroke="#9A9186" stroke-width="0.8"/>
  <text x="380" y="428" text-anchor="middle" font-size="15" letter-spacing="1.4" fill="#1F1B17">相鼠有皮，人而无仪；相鼠有齿，人而无止；相鼠有体，人而无礼</text>
  <text x="380" y="448" text-anchor="middle" font-size="7.6" letter-spacing="1" fill="#7C6D5C">鼠之三有，都是天生；人之三无，都是自弃</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">相鼠 · 鼠之三有</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图一 · 名物 · sj052a</text>
</svg>
