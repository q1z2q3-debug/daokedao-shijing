  <text x="592" y="238" font-size="6.6" fill="#994433">端有肉</text>
  <text x="583" y="342" text-anchor="middle" font-size="7.4" fill="#5C544A">角　钝而不刺</text>
  <text x="44" y="466" font-size="7.8" fill="#5C544A">麟：麕身、牛尾、马蹄、一角</text>
  <text x="264" y="466" font-size="7.8" fill="#5C544A">三处皆能伤，而皆不伤</text>
  <text x="486" y="466" font-size="7.8" fill="#5C544A">角端一圈钝，是其仁处</text>
