  <text x="380" y="512" text-anchor="middle" font-size="16" letter-spacing="3" fill="#1F1B17">麟之趾，振振公子</text>
  <text x="44" y="524" font-size="7.4" letter-spacing="1" fill="#9A9186">贵在不害</text>
