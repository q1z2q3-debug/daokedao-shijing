<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Noto Serif SC,Songti SC,serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-size="21" letter-spacing="8" fill="#1F1B17" font-weight="700">行役 · 旧誓 · 阔绝</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.6" letter-spacing="2" fill="#5C544A">《诗经》邶风 · 第六篇　击鼓</text>
  <defs><marker id="ar31" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#994433"/></marker></defs>
  <rect x="70" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="145" y="214" text-anchor="middle" font-size="28" letter-spacing="2" fill="#5C544A" font-weight="700">行役</text>
  <text x="145" y="252" text-anchor="middle" font-size="10" fill="#3B352F">我独南行</text>
  <text x="145" y="278" text-anchor="middle" font-size="8" fill="#9A9186">不我以归</text>
  <rect x="290" y="150" width="150" height="150" fill="#FCFAF6" stroke="#994433" stroke-width="1.1"/>
  <text x="365" y="214" text-anchor="middle" font-size="28" letter-spacing="2" fill="#994433" font-weight="700">旧誓</text>
  <text x="365" y="252" text-anchor="middle" font-size="10" fill="#3B352F">与子成说</text>
  <text x="365" y="278" text-anchor="middle" font-size="8" fill="#9A9186">执手偕老</text>
  <rect x="510" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="585" y="214" text-anchor="middle" font-size="28" letter-spacing="2" fill="#5C544A" font-weight="700">阔绝</text>
  <text x="585" y="252" text-anchor="middle" font-size="10" fill="#3B352F">不我活兮</text>
  <text x="585" y="278" text-anchor="middle" font-size="8" fill="#9A9186">不我信兮</text>
  <line x1="220" y1="225" x2="288" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar31)"/>
  <line x1="440" y1="225" x2="508" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar31)"/>
  <text x="380" y="330" text-anchor="middle" font-size="8.4" fill="#5C544A">公中之事与家中之誓，中间一誓相接，终被行役扯断</text>
  <line x1="120" y1="360" x2="640" y2="360" stroke="#9A9186" stroke-width="0.8"/>
  <text x="230" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">契阔</text>
  <text x="230" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">契合阔离，非「契约广阔」</text>
  <text x="530" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">偕老</text>
  <text x="530" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">临别旧约，军中悬空未践</text>
  <text x="380" y="446" text-anchor="middle" font-size="7.4" fill="#9A9186">末章「不我活」「不我信」是绝语，非婚礼赞歌</text>
  <text x="120" y="512" font-size="5.6" fill="#5C544A">诗经 · 邶风</text>
  <text x="640" y="512" text-anchor="end" font-size="5.6" fill="#5C544A">图二 · 行役旧誓阔绝 · sj031b</text>
</svg>