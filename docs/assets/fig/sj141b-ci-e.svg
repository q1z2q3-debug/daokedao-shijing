<line x1="50.0" y1="392.0" x2="710.0" y2="392.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="418.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.6" fill="#A63D2F" text-anchor="middle" font-weight="bold" letter-spacing="0.6">知而不改，讯而不顾；颠倒思予，已晚无及</text>
<text x="380.0" y="442.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="0.3">梅枝与鸮剪影置右侧；不良之人不画，朱线断在「思予」一结。</text>
