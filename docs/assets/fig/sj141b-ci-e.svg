<line x1="44.0" y1="212.0" x2="716.0" y2="212.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">国人知之</text>
<text x="226.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">夫也不良，国人知之</text>
<text x="566.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">公著</text>
<line x1="44.0" y1="282.0" x2="716.0" y2="282.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">歌以讯之</text>
<text x="226.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">夫也不良，歌以讯之</text>
<text x="566.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">告谏</text>
<line x1="44.0" y1="352.0" x2="716.0" y2="352.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">颠倒思予</text>
<text x="226.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">讯予不顾，颠倒思予</text>
<text x="566.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">已晚</text>
