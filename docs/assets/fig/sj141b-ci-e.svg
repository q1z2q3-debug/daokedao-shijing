<text x="380.0" y="72.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="25.0" fill="#7A2F26" text-anchor="middle" font-weight="bold" letter-spacing="1.6">墓门　刺不良</text>
<text x="720.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="end" font-weight="normal" letter-spacing="1.0">诗三百五篇 · 之一百四十一</text>
