<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#1F1B17" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#1F1B17" letter-spacing="2">莫我顾</text>
  <text x="380" y="76" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.2" fill="#7C6D5C" letter-spacing="1.2">《王风·葛藟》　宗族既远，依人无亲</text>
  <text x="724" y="76" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">SJ071b</text>

  <rect x="40" y="100" width="680" height="380" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>

  <!-- contrast -->
  <rect x="64" y="120" width="300" height="30" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="214" y="139" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.8" fill="#7C6D5C">葛藟在涯：根有所托</text>
  <rect x="396" y="120" width="300" height="30" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="546" y="139" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.8" fill="#994433">终远兄弟：人无所依</text>

  <!-- three cards -->
  <rect x="64" y="176" width="194" height="150" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="161" y="196" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">一章 · 浒</text>
  <text x="161" y="224" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11" fill="#1F1B17">谓他人父</text>
  <text x="161" y="252" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12" fill="#994433">莫我顾</text>
  <text x="161" y="278" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7" fill="#1F1B17">不肯顾恤</text>
  <text x="161" y="302" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="5.6" fill="#7C6D5C">在河之浒</text>

  <rect x="283" y="176" width="194" height="150" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="380" y="196" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">二章 · 涘</text>
  <text x="380" y="224" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11" fill="#1F1B17">谓他人母</text>
  <text x="380" y="252" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12" fill="#994433">莫我有</text>
  <text x="380" y="278" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7" fill="#1F1B17">不肯认亲</text>
  <text x="380" y="302" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="5.6" fill="#7C6D5C">在河之涘</text>

  <rect x="502" y="176" width="194" height="150" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="599" y="196" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">三章 · 漘</text>
  <text x="599" y="224" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11" fill="#1F1B17">谓他人昆</text>
  <text x="599" y="252" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="12" fill="#994433">莫我闻</text>
  <text x="599" y="278" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7" fill="#1F1B17">不肯恤问</text>
  <text x="599" y="302" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="5.6" fill="#7C6D5C">在河之漘</text>

  <!-- arrows between cards -->
  <path d="M260 251 L280 251" stroke="#994433" stroke-width="0.8"/>
  <path d="M280 251 L274 247 L274 255 Z" fill="#994433"/>
  <path d="M479 251 L499 251" stroke="#994433" stroke-width="0.8"/>
  <path d="M499 251 L493 247 L493 255 Z" fill="#994433"/>

  <!-- bottom -->
  <line x1="40" y1="356" x2="720" y2="356" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="380" y="380" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8" fill="#1F1B17">亲称愈下，人愈不亲；顾、有、闻，一层薄过一层</text>
  <text x="380" y="402" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6" fill="#9A9186">毛序：王族刺平王，弃其九族　｜　朱子：世衰民散，流离失所者自叹</text>
  <rect x="202" y="418" width="356" height="34" fill="none" stroke="#994433" stroke-width="1"/>
  <text x="380" y="440" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.4" fill="#994433" letter-spacing="0.8">终远兄弟，亦莫我闻</text>

  <text x="724" y="522" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">图二 · 莫我顾 · sj071b</text>
</svg>
