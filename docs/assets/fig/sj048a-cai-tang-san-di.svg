  <text x="380" y="478" text-anchor="middle" font-size="15" letter-spacing="2.5" fill="#1F1B17">期我乎桑中，要我乎上宫，送我乎淇之上矣</text>
  <text x="380" y="498" text-anchor="middle" font-size="7.6" letter-spacing="1" fill="#7C6D5C">采物三章，约会三地；三章只换物、换方、换姓</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">唐、麦、葑：皆起兴之物</text>
