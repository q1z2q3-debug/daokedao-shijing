<text x="226.0" y="218.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">昏以为期，明星煌煌</text>
<text x="566.0" y="218.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">候</text>
