<text x="380.0" y="72.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="25.0" fill="#7A2F26" text-anchor="middle" font-weight="bold" letter-spacing="1.6">东门之杨　期会失候</text>
<text x="720.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="end" font-weight="normal" letter-spacing="1.0">诗三百五篇 · 之一百四十</text>
<line x1="38.0" y1="100.0" x2="722.0" y2="100.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="122.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.2" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="1.0">人不至而星自明</text>
<line x1="44.0" y1="240.0" x2="716.0" y2="240.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
