<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7C6D5C"/></marker></defs>
<rect x="10" y="16" width="740" height="508" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="1.0"/>
<rect x="22" y="28" width="716" height="484" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="380" y="52" font-size="15" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="3">缁衣　好贤三级</text>
<line x1="230" y1="66" x2="530" y2="66" stroke="#994433" stroke-width="1.0"/>
<rect x="60" y="190" width="122" height="50" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="121" y="210" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">缁衣之敝</text>
<text x="121" y="227" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">卿士正服，旧</text>
<rect x="214" y="190" width="92" height="50" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="260" y="210" font-size="12" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">改</text>
<text x="260" y="227" font-size="8.5" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">改·改造·改作</text>
<rect x="344" y="190" width="118" height="50" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.9"/>
<text x="403" y="210" font-size="11" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">适子之馆</text>
<text x="403" y="227" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不惮其往</text>
<rect x="500" y="190" width="130" height="50" fill="#F7F4EE" stroke="#994433" stroke-width="1.3"/>
<text x="565" y="210" font-size="11" fill="#994433" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">授子之粲</text>
<text x="565" y="227" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">不吝其食</text>
<line x1="182" y1="215.0" x2="212" y2="215.0" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<line x1="306" y1="215.0" x2="342" y2="215.0" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<line x1="462" y1="215.0" x2="498" y2="215.0" stroke="#7C6D5C" stroke-width="1.0" marker-end="url(#ah)"/>
<text x="121" y="132" font-size="11" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="2">宜　好　席</text>
<line x1="121" y1="140" x2="121" y2="184" stroke="#DCD5C8" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="232" y="132" font-size="9" fill="#9A9186" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三章所换者——衣之评</text>
<line x1="403" y1="250" x2="403" y2="296" stroke="#25211D" stroke-width="0.9"/>
<line x1="565" y1="250" x2="565" y2="296" stroke="#25211D" stroke-width="0.9"/>
<line x1="400" y1="300" x2="568" y2="300" stroke="#25211D" stroke-width="1.1"/>
<text x="484" y="320" font-size="10" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">三章不换者——诗之骨</text>
<text x="121" y="366" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">衣之：养其体</text>
<text x="403" y="366" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">馆之：安其居</text>
<text x="565" y="366" font-size="9.5" fill="#7C6D5C" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif">粲之：饱其腹</text>
<line x1="60" y1="444" x2="700" y2="444" stroke="#7C6D5C" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="380" y="470" font-size="13" fill="#25211D" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Songti SC, serif" letter-spacing="1">衣可敝，礼不可废；物可旧，人不可弃</text>
</svg>