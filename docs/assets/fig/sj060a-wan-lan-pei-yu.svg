  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="44" y="56" font-size="8.6" letter-spacing="2" fill="#994433">卫风 · 六</text>
  <text x="380" y="58" text-anchor="middle" font-size="25" letter-spacing="1.4" fill="#1F1B17" font-weight="700">芄兰与佩</text>
  <text x="716" y="56" text-anchor="end" font-size="8.2" letter-spacing="1.5" fill="#9A9186">诗三百五篇 · 之六十</text>
  <text x="380" y="78" text-anchor="middle" font-size="8.2" letter-spacing="1.2" fill="#7C6D5C">《诗经》卫风 · 第六篇　芄兰</text>
  <line x1="44" y1="96" x2="716" y2="96" stroke="#9A9186" stroke-width="0.8"/>

  <!-- left: vine -->
  <rect x="44" y="116" width="206" height="248" fill="#F2EFE6" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="56" y="136" font-size="7.4" fill="#994433" font-weight="700">芄兰</text>
  <!-- stem -->
  <path d="M72,344 C82,300 100,270 120,242 C150,196 182,172 216,150" fill="none" stroke="#7C6D5C" stroke-width="1.1"/>
  <path d="M120,242 C132,230 142,222 154,218" fill="none" stroke="#7C6D5C" stroke-width="0.7"/>
  <path d="M155,196 C170,190 184,186 196,184" fill="none" stroke="#7C6D5C" stroke-width="0.7"/>
  <!-- leaves -->
  <path d="M96,286 C86,276 92,258 112,258 C118,270 112,286 96,286 Z" fill="none" stroke="#7C6D5C" stroke-width="0.7"/>
  <path d="M120,242 C110,232 116,214 136,214 C142,226 136,242 120,242 Z" fill="none" stroke="#7C6D5C" stroke-width="0.7"/>
  <path d="M155,196 C145,186 152,168 172,168 C178,180 172,196 155,196 Z" fill="none" stroke="#7C6D5C" stroke-width="0.7"/>
  <path d="M190,170 C180,160 186,146 204,146 C210,158 204,170 190,170 Z" fill="none" stroke="#7C6D5C" stroke-width="0.7"/>
  <g stroke="#9A9186" stroke-width="0.4">
    <line x1="96" y1="286" x2="112" y2="258"/>
    <line x1="120" y1="242" x2="136" y2="214"/>
    <line x1="155" y1="196" x2="172" y2="168"/>
    <line x1="190" y1="170" x2="204" y2="146"/>
  </g>
  <!-- sap -->
  <line x1="108" y1="276" x2="108" y2="290" stroke="#9A9186" stroke-width="0.5"/>
  <circle cx="108" cy="294" r="2.4" fill="#F7F4EE" stroke="#7C6D5C" stroke-width="0.5"/>
  <text x="144" y="248" font-size="6.2" fill="#7C6D5C">支</text>
  <text x="176" y="200" font-size="6.2" fill="#7C6D5C">叶</text>
  <text x="56" y="344" font-size="6.2" fill="#1F1B17">萝藦，蔓生</text>
  <text x="56" y="358" font-size="6.2" fill="#7C6D5C">断之有白汁，可食</text>

  <!-- center: xi and she -->
  <rect x="270" y="116" width="216" height="248" fill="#F2EFE6" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="282" y="136" font-size="7.4" fill="#994433" font-weight="700">觿与韘</text>
  <!-- knot -->
  <path d="M286,214 C276,200 288,190 300,200 C312,210 306,224 294,220 C284,216 282,210 286,214 Z" fill="none" stroke="#5C544A" stroke-width="0.6"/>
  <path d="M294,220 C300,232 310,238 318,240" fill="none" stroke="#5C544A" stroke-width="0.5"/>
  <!-- xi -->
  <path d="M292,182 C312,192 342,220 370,250 C354,256 330,238 302,208 C292,198 286,188 292,182 Z" fill="none" stroke="#7C6D5C" stroke-width="0.9"/>
  <circle cx="300" cy="190" r="2" fill="none" stroke="#7C6D5C" stroke-width="0.5"/>
  <line x1="292" y1="182" x2="300" y2="190" stroke="#7C6D5C" stroke-width="0.5"/>
  <text x="282" y="176" font-size="6.2" fill="#1F1B17">觿</text>
  <text x="300" y="330" font-size="6.2" fill="#1F1B17">解结</text>
  <text x="300" y="346" font-size="6.1" fill="#7C6D5C">成人之佩</text>
  <!-- she -->
  <ellipse cx="420" cy="286" rx="27" ry="21" fill="none" stroke="#7C6D5C" stroke-width="0.9"/>
  <ellipse cx="420" cy="286" rx="16" ry="11" fill="none" stroke="#7C6D5C" stroke-width="0.6"/>
  <path d="M420,265 L420,258 L427,254" fill="none" stroke="#7C6D5C" stroke-width="0.6"/>
  <text x="410" y="258" font-size="6.2" fill="#1F1B17">韘</text>
  <text x="420" y="330" font-size="6.2" fill="#1F1B17">钩弦</text>
  <text x="420" y="346" font-size="6.1" fill="#7C6D5C">射御之佩</text>
  <text x="282" y="360" font-size="6.1" fill="#994433">器在身，才不在身</text>

  <!-- right: youth -->
  <rect x="506" y="116" width="210" height="248" fill="#F2EFE6" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="518" y="136" font-size="7.4" fill="#994433" font-weight="700">容兮遂兮</text>
  <!-- head -->
  <ellipse cx="590" cy="160" rx="10" ry="12" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <path d="M581,154 C583,143 597,143 599,154" fill="none" stroke="#1F1B17" stroke-width="0.8"/>
  <circle cx="600" cy="145" r="4" fill="none" stroke="#1F1B17" stroke-width="0.5"/>
  <!-- body -->
  <path d="M580,174 C570,200 568,230 570,262 L610,262 C612,230 610,200 600,174 Z" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <!-- belt -->
  <rect x="568" y="250" width="44" height="8" fill="none" stroke="#994433" stroke-width="0.8"/>
  <line x1="590" y1="250" x2="590" y2="258" stroke="#994433" stroke-width="0.4"/>
  <!-- sash -->
  <path d="M612,258 C618,280 618,308 614,330" fill="none" stroke="#994433" stroke-width="0.7"/>
  <path d="M612,330 L608,340 M612,330 L616,340" fill="none" stroke="#994433" stroke-width="0.4"/>
  <!-- jade -->
  <circle cx="642" cy="270" r="9" fill="none" stroke="#7C6D5C" stroke-width="0.8"/>
  <circle cx="642" cy="270" r="4" fill="none" stroke="#7C6D5C" stroke-width="0.5"/>
  <line x1="642" y1="261" x2="642" y2="252" stroke="#7C6D5C" stroke-width="0.5"/>
  <!-- knife -->
  <path d="M540,258 L560,252 L562,260 L542,266 Z" fill="none" stroke="#5C544A" stroke-width="0.7"/>
  <text x="590" y="204" text-anchor="middle" font-size="6.1" fill="#994433">童子</text>
  <text x="528" y="246" font-size="6.1" fill="#7C6D5C">容刀</text>
  <text x="642" y="246" font-size="6.1" fill="#7C6D5C">瑞玉</text>
  <text x="628" y="320" font-size="6.1" fill="#7C6D5C">垂带</text>
  <text x="518" y="344" font-size="6.2" fill="#1F1B17">容仪可观</text>
  <text x="518" y="358" font-size="6.1" fill="#7C6D5C">而德不称服</text>

  <!-- bottom -->
  <line x1="44" y1="378" x2="716" y2="378" stroke="#9A9186" stroke-width="0.7"/>
  <text x="44" y="396" font-size="7.2" fill="#994433" font-weight="700">虽则佩觿，能不我知；虽则佩韘，能不我甲。</text>
  <text x="44" y="418" font-size="6.4" fill="#7C6D5C">器在身，才不在身；服在身，德不在身。</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">芄兰 · 二章章六句</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图一 · 名物 · sj060a</text>
</svg>
