<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="44" y="56" font-size="8.6" letter-spacing="2" fill="#994433">卫风 · 六</text>
  <text x="380" y="58" text-anchor="middle" font-size="25" letter-spacing="1.4" fill="#1F1B17" font-weight="700">德不称服</text>
  <text x="716" y="56" text-anchor="end" font-size="8.2" letter-spacing="1.5" fill="#9A9186">诗三百五篇 · 之六十</text>
  <text x="380" y="78" text-anchor="middle" font-size="8.2" letter-spacing="1.2" fill="#7C6D5C">《诗经》卫风 · 第六篇　芄兰</text>
  <line x1="44" y1="96" x2="716" y2="96" stroke="#9A9186" stroke-width="0.8"/>

  <!-- balance stand -->
  <line x1="380" y1="205" x2="380" y2="390" stroke="#5C544A" stroke-width="1"/>
  <line x1="338" y1="390" x2="422" y2="390" stroke="#5C544A" stroke-width="1"/>
  <path d="M380,205 L370,220 L390,220 Z" fill="none" stroke="#5C544A" stroke-width="0.8"/>
  <text x="380" y="236" text-anchor="middle" font-size="6.2" fill="#994433">衡</text>

  <!-- beam -->
  <line x1="190" y1="250" x2="570" y2="160" stroke="#5C544A" stroke-width="1.1"/>
  <circle cx="380" cy="205" r="4" fill="none" stroke="#994433" stroke-width="0.7"/>

  <!-- left pan: fu -->
  <line x1="190" y1="250" x2="165" y2="320" stroke="#9A9186" stroke-width="0.6"/>
  <line x1="190" y1="250" x2="215" y2="320" stroke="#9A9186" stroke-width="0.6"/>
  <path d="M160,326 C170,342 210,342 220,326" fill="none" stroke="#5C544A" stroke-width="0.9"/>
  <line x1="160" y1="326" x2="220" y2="326" stroke="#5C544A" stroke-width="0.6"/>
  <text x="190" y="318" text-anchor="middle" font-size="11" fill="#994433" font-weight="700">服</text>
  <text x="190" y="356" text-anchor="middle" font-size="6.1" fill="#1F1B17">觿 · 韘 · 容刀</text>
  <text x="190" y="370" text-anchor="middle" font-size="6.1" fill="#1F1B17">瑞玉 · 垂带</text>
  <text x="242" y="246" font-size="6.2" fill="#994433">重</text>

  <!-- right pan: de -->
  <line x1="570" y1="160" x2="545" y2="225" stroke="#9A9186" stroke-width="0.6"/>
  <line x1="570" y1="160" x2="595" y2="225" stroke="#9A9186" stroke-width="0.6"/>
  <path d="M540,231 C550,247 590,247 600,231" fill="none" stroke="#5C544A" stroke-width="0.9"/>
  <line x1="540" y1="231" x2="600" y2="231" stroke="#5C544A" stroke-width="0.6"/>
  <text x="570" y="224" text-anchor="middle" font-size="11" fill="#994433" font-weight="700">德</text>
  <text x="570" y="262" text-anchor="middle" font-size="6.1" fill="#1F1B17">知 · 才</text>
  <text x="512" y="174" font-size="6.2" fill="#994433">轻</text>

  <!-- center note -->
  <text x="300" y="292" text-anchor="middle" font-size="6.4" fill="#7C6D5C">服盛而德轻</text>
  <text x="300" y="308" text-anchor="middle" font-size="6.2" fill="#7C6D5C">器在身，才不在身</text>

  <!-- bottom -->
  <line x1="44" y1="392" x2="716" y2="392" stroke="#9A9186" stroke-width="0.8"/>
  <rect x="286" y="408" width="188" height="28" fill="none" stroke="#994433" stroke-width="1"/>
  <text x="380" y="427" text-anchor="middle" font-size="8.6" fill="#994433" font-weight="700">其德不称服</text>
  <text x="380" y="460" text-anchor="middle" font-size="6.6" fill="#1F1B17">容兮遂兮，垂带悸兮；越是齐整，越是空</text>
  <text x="44" y="486" font-size="6.2" fill="#7C6D5C">芄兰柔弱，需依缘而起；童子佩器，需成德而立。</text>

  <text x="44" y="516" font-size="6.2" fill="#9A9186">芄兰 · 二章章六句</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图二 · 义理 · sj060b</text>
</svg>
