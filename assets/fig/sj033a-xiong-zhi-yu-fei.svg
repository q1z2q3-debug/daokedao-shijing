  <text x="44" y="466" font-size="7.8" fill="#5C544A">壹 雉冠　雄雉有冠</text>
  <text x="264" y="466" font-size="7.8" fill="#5C544A">贰 长尾　雉之识别，不求全鸟</text>
  <text x="486" y="466" font-size="7.8" fill="#5C544A">叁 日月　流转不息，道远难来</text>
