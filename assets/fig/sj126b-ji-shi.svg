<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
<rect width="760" height="540" fill="#F6EFE4"/><rect x="10" y="10" width="740" height="520" fill="none" stroke="#A0604F" stroke-width="0.6"/><rect x="22" y="28" width="716" height="470" fill="none" stroke="#A0604F" stroke-width="0.8"/><text x="38.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.5" fill="#A63D2F" text-anchor="start" font-weight="normal" letter-spacing="2.0">秦 风 · 之一</text><text x="380.0" y="72.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="25.0" fill="#7A2F26" text-anchor="middle" font-weight="bold" letter-spacing="1.6">车邻　未见·既见·不乐</text><text x="720.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="end" font-weight="normal" letter-spacing="1.0">诗三百五篇 · 之一百二十六</text><line x1="38.0" y1="100.0" x2="722.0" y2="100.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/><text x="380.0" y="122.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.2" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="1.0">盛有期限，乐在当下</text><line x1="44.0" y1="212.0" x2="716.0" y2="212.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/><line x1="44.0" y1="282.0" x2="716.0" y2="282.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/><line x1="44.0" y1="352.0" x2="716.0" y2="352.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/><line x1="204.0" y1="168.0" x2="204.0" y2="352.0" stroke="#A63D2F" stroke-width="0.55" opacity="1.00"/><text x="62.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.0" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">未见</text><line x1="60.0" y1="206.0" x2="60.0" y2="114.0" stroke="#7A2F26" stroke-width="0.70" opacity="1.00"/><line x1="140.0" y1="206.0" x2="140.0" y2="114.0" stroke="#7A2F26" stroke-width="0.70" opacity="1.00"/><line x1="42.0" y1="114.0" x2="158.0" y2="114.0" stroke="#7A2F26" stroke-width="0.80" opacity="1.00"/><line x1="62.0" y1="120.0" x2="62.0" y2="164.0" stroke="#7A2F26" stroke-width="0.40" opacity="1.00"/><line x1="138.0" y1="120.0" x2="138.0" y2="164.0" stroke="#7A2F26" stroke-width="0.40" opacity="1.00"/><line x1="62.0" y1="142.0" x2="138.0" y2="142.0" stroke="#7A2F26" stroke-width="0.35" opacity="1.00"/><text x="226.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">车在门外，寺人传令；先闻其声，未见其人。</text><text x="62.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.0" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">既见</text><text x="226.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">阪漆隰栗，并坐鼓瑟；有而能用，才叫乐。</text><line x1="236.0" y1="278.0" x2="300.0" y2="278.0" stroke="#7A2F26" stroke-width="0.45" opacity="1.00"/><circle cx="320.0" cy="274.0" r="7.0" fill="none" stroke="#7A2F26" stroke-width="0.40"/><text x="352.0" y="278.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">瑟</text><text x="62.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.0" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">不乐</text><text x="226.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">今者不乐，逝者其耋；再一步，就是其亡。</text><line x1="50.0" y1="392.0" x2="710.0" y2="392.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/><text x="380.0" y="418.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.6" fill="#A63D2F" text-anchor="middle" font-weight="bold" letter-spacing="0.6">车可邻，乐不可待；今者不乐，逝者其耋。</text><text x="380.0" y="486.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="0.0">图二 · 义理</text><rect x="676" y="492" width="22" height="22" fill="#B35142" opacity="0.13"/><text x="687.0" y="507.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#B35142" text-anchor="middle" font-weight="normal" letter-spacing="0.0">润</text>
</svg>
