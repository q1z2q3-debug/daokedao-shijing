<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-size="21" letter-spacing="8" fill="#1F1B17" font-weight="700">此 地 · 彼 处</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.6" letter-spacing="2" fill="#5C544A">《诗经》周南 · 第三篇　卷耳</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#994433"/></marker></defs>
  <rect x="70" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="145" y="212" text-anchor="middle" font-size="24" letter-spacing="3" fill="#5C544A" font-weight="700">此地</text>
  <text x="145" y="250" text-anchor="middle" font-size="10" fill="#3B352F">采采卷耳</text>
  <text x="145" y="276" text-anchor="middle" font-size="8" fill="#9A9186">一章</text>
  <rect x="290" y="150" width="150" height="150" fill="#FCFAF6" stroke="#994433" stroke-width="1.1"/>
  <text x="365" y="212" text-anchor="middle" font-size="24" letter-spacing="3" fill="#994433" font-weight="700">怀人</text>
  <text x="365" y="250" text-anchor="middle" font-size="10" fill="#3B352F">不盈顷筐</text>
  <text x="365" y="276" text-anchor="middle" font-size="8" fill="#9A9186">中轴</text>
  <rect x="510" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="585" y="212" text-anchor="middle" font-size="24" letter-spacing="3" fill="#5C544A" font-weight="700">彼处</text>
  <text x="585" y="250" text-anchor="middle" font-size="10" fill="#3B352F">马瘏仆痡</text>
  <text x="585" y="276" text-anchor="middle" font-size="8" fill="#9A9186">二至四章</text>
  <line x1="220" y1="225" x2="288" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="440" y1="225" x2="508" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar)"/>
  <text x="380" y="330" text-anchor="middle" font-size="8.4" fill="#5C544A">两幅并置，中间一根线：她在此，他在彼——诗不许他们相见</text>
  <line x1="120" y1="360" x2="640" y2="360" stroke="#9A9186" stroke-width="0.8"/>
  <text x="230" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">维以不永怀</text>
  <text x="230" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">酒为忘，不为乐</text>
  <text x="530" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">云何吁矣</text>
  <text x="530" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">三「矣」之后，唯一的出声</text>
  <text x="380" y="446" text-anchor="middle" font-size="7.4" fill="#9A9186">《诗》四章　·　一幅独起，三幅一排</text>
  <text x="120" y="512" font-size="5.6" fill="#5C544A">诗经 · 周南</text>
  <text x="640" y="512" text-anchor="end" font-size="5.6" fill="#5C544A">图二 · 此地彼处 · sj003b</text>
</svg>