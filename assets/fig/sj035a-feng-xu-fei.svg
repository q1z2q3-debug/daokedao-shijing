  <text x="44" y="466" font-size="7.8" fill="#5C544A">壹 葑菲　根叶并采，不以根弃叶</text>
  <text x="264" y="466" font-size="7.8" fill="#5C544A">贰 梁笱　鱼堰竹笼，护我旧业</text>
  <text x="486" y="466" font-size="7.8" fill="#5C544A">叁 荼荠　苦菜甜菜，苦甘自陈</text>
