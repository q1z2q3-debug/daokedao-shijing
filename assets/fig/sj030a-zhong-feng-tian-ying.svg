  <text x="44" y="466" font-size="7.8" fill="#5C544A">壹 终风　云气回旋，风夹尘土</text>
  <text x="264" y="466" font-size="7.8" fill="#5C544A">贰 顾我　回顾相顾，低头含情</text>
  <text x="486" y="466" font-size="7.8" fill="#5C544A">叁 阴雷　叠云蔽日，雷纹将发</text>
