  <text x="622" y="330" text-anchor="middle" font-size="7.0" fill="#994433">曀曀其阴，虺虺其雷</text>
  <text x="120" y="132" font-size="7.6" fill="#994433">壹</text>
  <text x="350" y="132" font-size="7.6" fill="#994433">贰</text>
