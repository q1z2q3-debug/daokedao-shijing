  <text x="148" y="372" text-anchor="middle" font-size="7.4" fill="#994433">柏木舟，舟身有定</text>

  <!-- 贰 两髦 -->
  <text x="350" y="132" font-size="7.6" fill="#994433">贰</text>
  <ellipse cx="380" cy="212" rx="27" ry="33" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.0"/>
