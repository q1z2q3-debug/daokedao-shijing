  <text x="380" y="372" text-anchor="middle" font-size="7.4" fill="#994433">两髦，未冠男子的发式</text>

  <!-- 叁 河 -->
  <text x="590" y="132" font-size="7.6" fill="#994433">叁</text>
  <path d="M540,270 q18,-7 36,0 q18,7 36,0 q18,-7 36,0" fill="none" stroke="#9A9186" stroke-width="0.7"/>
