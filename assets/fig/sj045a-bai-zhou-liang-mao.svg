  <text x="592" y="240" text-anchor="middle" font-size="6.6" fill="#994433">中河</text>
  <circle cx="654" cy="330" r="8" fill="none" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="654" y="318" text-anchor="middle" font-size="6.6" fill="#7C6D5C">河侧</text>
  <text x="612" y="372" text-anchor="middle" font-size="7.4" fill="#994433">中河到河侧，舟不出河</text>

  <text x="44" y="420" font-size="7.8" fill="#5C544A">壹 舟　柏木为身，平浮不破浪</text>
  <text x="274" y="420" font-size="7.8" fill="#5C544A">贰 两髦　发齐眉，分向两边</text>
  <text x="494" y="420" font-size="7.8" fill="#5C544A">叁 河　位置略移，心誓不移</text>
  <line x1="44" y1="438" x2="716" y2="438" stroke="#9A9186" stroke-width="0.8"/>
  <text x="380" y="474" text-anchor="middle" font-size="16" letter-spacing="3" fill="#1F1B17">汎彼柏舟，在彼中河</text>
  <text x="44" y="506" font-size="7.4" letter-spacing="1" fill="#9A9186">舟有定所，心有所匹</text>
  <text x="716" y="506" text-anchor="end" font-size="7.4" letter-spacing="1" fill="#9A9186">图一 · 名物 · sj045a</text>
