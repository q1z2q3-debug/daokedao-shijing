<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
<rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <text x="44" y="58" font-size="8.6" letter-spacing="2" fill="#994433">鄘风 · 一</text>
  <text x="380" y="60" text-anchor="middle" font-size="26" letter-spacing="10" fill="#1F1B17" font-weight="700">柏 舟</text>
  <text x="716" y="58" text-anchor="end" font-size="8.2" letter-spacing="1.5" fill="#9A9186">诗三百五篇 · 之四十五</text>
