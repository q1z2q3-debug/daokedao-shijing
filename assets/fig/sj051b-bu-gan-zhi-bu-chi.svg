<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="380" y="52" text-anchor="middle" font-size="19" letter-spacing="2.4" fill="#1F1B17" font-weight="700">不敢指虹，不齿其人</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.2" letter-spacing="2" fill="#5C544A">《诗经》鄘风 · 第七篇　蝃蝀</text>
  <line x1="44" y1="94" x2="716" y2="94" stroke="#9A9186" stroke-width="0.8"/>

  <!-- 虹 -->
  <rect x="50" y="126" width="200" height="226" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="70" y="154" font-size="12" letter-spacing="2" fill="#7C6D5C">虹</text>
  <g fill="none" stroke-width="3">
    <path d="M74,286 A76,76 0 0 1 226,286" stroke="#994433"/>
    <path d="M82,286 A68,68 0 0 1 218,286" stroke="#C07A4A"/>
    <path d="M90,286 A60,60 0 0 1 210,286" stroke="#B9975B"/>
    <path d="M98,286 A52,52 0 0 1 202,286" stroke="#7C8B6B"/>
    <path d="M106,286 A44,44 0 0 1 194,286" stroke="#6E7F8D"/>
  </g>
  <line x1="74" y1="286" x2="226" y2="286" stroke="#7C6D5C" stroke-width="0.7"/>
  <text x="150" y="306" text-anchor="middle" font-size="7.4" fill="#994433">莫之敢指</text>
  <text x="150" y="322" text-anchor="middle" font-size="6.2" fill="#7C6D5C">天地之淫气</text>

  <!-- 奔女 -->
  <rect x="280" y="126" width="200" height="226" fill="#F2E7D5" stroke="#994433" stroke-width="1.1"/>
  <text x="300" y="154" font-size="12" letter-spacing="2" fill="#994433">奔女</text>
  <line x1="300" y1="166" x2="300" y2="330" stroke="#D8CBB8" stroke-width="0.6"/>
  <g>
    <circle cx="375" cy="210" r="12" fill="#FCFAF6" stroke="#1F1B17" stroke-width="0.8"/>
    <path d="M375,222 L375,266 M375,238 L358,252 M375,238 L392,252 M375,266 L360,304 M375,266 L390,304" stroke="#1F1B17" stroke-width="2"/>
    <path d="M360,304 L350,320 M390,304 L400,320" stroke="#1F1B17" stroke-width="1.2"/>
  </g>
  <line x1="330" y1="330" x2="430" y2="330" stroke="#7C6D5C" stroke-width="0.8"/>
  <text x="380" y="176" text-anchor="middle" font-size="7.4" fill="#994433">女子有行</text>
  <text x="380" y="190" text-anchor="middle" font-size="6.2" fill="#7C6D5C">远父母兄弟 · 怀婚姻</text>

  <!-- 国人 -->
  <rect x="510" y="126" width="200" height="226" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="530" y="154" font-size="12" letter-spacing="2" fill="#7C6D5C">国人</text>
  <line x1="530" y1="166" x2="530" y2="330" stroke="#DCD5C8" stroke-width="0.6"/>
  <g fill="#1F1B17">
    <circle cx="565" cy="212" r="9"/><path d="M565,221 L565,258 M565,232 L550,244 M565,232 L580,244 M565,258 L552,286 M565,258 L578,286" stroke="#1F1B17" stroke-width="1.2"/>
    <circle cx="610" cy="212" r="9"/><path d="M610,221 L610,258 M610,232 L595,244 M610,232 L625,244 M610,258 L597,286 M610,258 L623,286" stroke="#1F1B17" stroke-width="1.2"/>
    <circle cx="670" cy="212" r="9"/><path d="M670,221 L670,258 M670,232 L655,244 M670,232 L685,244 M670,258 L657,286 M670,258 L683,286" stroke="#1F1B17" stroke-width="1.2"/>
  </g>
  <line x1="635" y1="200" x2="635" y2="292" stroke="#994433" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="610" y="306" text-anchor="middle" font-size="8" fill="#994433">不齿</text>
  <text x="610" y="322" text-anchor="middle" font-size="6.2" fill="#7C6D5C">大无信 · 不知命</text>

  <g stroke="#994433" stroke-width="1.2" fill="none">
    <path d="M254,238 L272,238 M264,232 L272,238 L264,244"/>
    <path d="M484,238 L502,238 M494,232 L502,238 L494,244"/>
  </g>

  <text x="380" y="382" text-anchor="middle" font-size="8.4" fill="#994433">从「不敢指」到「不齿」</text>

  <rect x="80" y="416" width="600" height="38" fill="#F2E7D5" stroke="#D8CBB8" stroke-width="0.8"/>
  <text x="380" y="434" text-anchor="middle" font-size="7.8" fill="#994433">虹不可指，人不可齿</text>
  <text x="380" y="448" text-anchor="middle" font-size="6" fill="#7C6D5C">礼法之眼，比虹更严 · 诗有它的时代，也有它的窄处</text>

  <text x="380" y="480" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#1F1B17">乃如之人也，怀昏姻也；大无信也，不知命也</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">鄘风 · 蝃蝀</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图二 · 义理 · sj051b</text>
</svg>
