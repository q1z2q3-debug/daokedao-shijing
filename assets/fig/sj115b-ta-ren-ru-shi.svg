<text x="62.0" y="240.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">廷内钟鼓</text>
<text x="212.0" y="240.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">弗洒弗埽／弗鼓弗考</text>
<text x="566.0" y="240.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">他人是保</text>
<line x1="44.0" y1="324.0" x2="716.0" y2="324.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="302.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">酒食鼓瑟</text>
<text x="212.0" y="302.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">何不日鼓瑟</text>
