<text x="380.0" y="442.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="0.3">左主位虚，右室有履迹。</text>
