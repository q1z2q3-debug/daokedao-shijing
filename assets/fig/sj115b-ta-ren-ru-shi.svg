<text x="212.0" y="364.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">物在册</text>
