<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#1F1B17" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#1F1B17" letter-spacing="2">乱世之乐</text>
  <text x="380" y="76" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.2" fill="#7C6D5C" letter-spacing="1.2">《王风·君子阳阳》　乐是壳，忧是底</text>
  <text x="724" y="76" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">SJ067b</text>

  <rect x="40" y="100" width="680" height="380" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>

  <!-- top band -->
  <rect x="64" y="116" width="180" height="44" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="154" y="142" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.6" fill="#7C6D5C">闵周</text>

  <text x="380" y="142" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.2" fill="#994433" letter-spacing="1">其乐只且</text>

  <rect x="516" y="116" width="180" height="44" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="606" y="142" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.6" fill="#7C6D5C">遭乱</text>

  <!-- 乐 center -->
  <circle cx="380" cy="198" r="27" fill="#994433" opacity="0.9"/>
  <text x="380" y="205" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="16" fill="#F7F4EE">乐</text>

  <!-- arrows -->
  <line x1="356" y1="214" x2="330" y2="240" stroke="#994433" stroke-width="1" opacity="0.8"/>
  <path d="M330 240 L337 237 L335 245 Z" fill="#994433" opacity="0.8"/>
  <line x1="404" y1="214" x2="430" y2="240" stroke="#994433" stroke-width="1" opacity="0.8"/>
  <path d="M430 240 L425 245 L433 237 Z" fill="#994433" opacity="0.8"/>

  <!-- left card: Mao -->
  <rect x="64" y="250" width="272" height="104" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="200" y="272" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#994433">毛序 · 禄仕全身</text>
  <text x="200" y="298" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8" fill="#1F1B17">君子遭乱，相招为禄仕</text>
  <text x="200" y="320" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.6" fill="#7C6D5C">苟得禄而已，不求道行</text>
  <text x="200" y="342" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">乐是自保的壳</text>

  <!-- right card: Zhu -->
  <rect x="424" y="250" width="272" height="104" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="560" y="272" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#994433">朱子 · 归家自乐</text>
  <text x="560" y="298" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8" fill="#1F1B17">其夫既归，安于贫贱</text>
  <text x="560" y="320" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.6" fill="#7C6D5C">不以行役为劳，以自乐</text>
  <text x="560" y="342" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">乐是自宽</text>

  <!-- bottom -->
  <line x1="40" y1="372" x2="720" y2="372" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="380" y="396" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.6" fill="#1F1B17" letter-spacing="0.8">两种乐，都不是太平之乐</text>
  <text x="380" y="420" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">乐越真，越见世乱；其乐只且，越读越轻，也越读越重</text>

  <rect x="222" y="432" width="316" height="34" fill="none" stroke="#994433" stroke-width="1"/>
  <text x="380" y="454" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.6" fill="#994433" letter-spacing="1.2">不是太平之乐，是乱世之乐</text>

  <text x="724" y="522" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">图二 · 乱世之乐 · sj067b</text>
</svg>
