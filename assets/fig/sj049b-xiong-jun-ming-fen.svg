<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="380" y="52" text-anchor="middle" font-size="19" letter-spacing="2.5" fill="#1F1B17" font-weight="700">名分还在，德已不配</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.2" letter-spacing="2" fill="#5C544A">《诗经》鄘风 · 第五篇　鹑之奔奔</text>
  <line x1="44" y1="96" x2="716" y2="96" stroke="#9A9186" stroke-width="0.8"/>

  <!-- 鸟 -->
  <rect x="50" y="126" width="200" height="210" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="70" y="158" font-size="14" letter-spacing="2" fill="#7C6D5C">鸟</text>
  <line x1="70" y1="168" x2="70" y2="312" stroke="#DCD5C8" stroke-width="0.6"/>
  <g fill="#FCFAF6" stroke="#1F1B17" stroke-width="0.8">
    <ellipse cx="130" cy="230" rx="27" ry="15"/>
    <circle cx="154" cy="216" r="8"/>
    <path d="M104,240 L88,252 L98,255 L112,244 Z"/>
    <ellipse cx="196" cy="244" rx="23" ry="13"/>
    <circle cx="217" cy="232" r="7"/>
    <path d="M175,252 L160,263 L170,266 L183,256 Z"/>
  </g>
  <g fill="#1F1B17">
    <path d="M112,224 Q130,216 146,226 Q132,232 112,224 Z"/>
    <path d="M180,238 Q196,230 211,240 Q198,246 180,238 Z"/>
    <circle cx="158" cy="214" r="1.5"/>
    <circle cx="220" cy="230" r="1.3"/>
  </g>
  <g fill="#994433" stroke="#994433" stroke-width="0.3">
    <path d="M162,215 L173,219 L162,222 Z"/>
    <path d="M224,231 L234,235 L224,238 Z"/>
  </g>
  <text x="150" y="284" text-anchor="middle" font-size="8" fill="#994433">常匹相随</text>
  <text x="150" y="300" text-anchor="middle" font-size="6.4" fill="#7C6D5C">鹑之奔奔，鹊之彊彊</text>

  <!-- 人 -->
  <rect x="280" y="126" width="200" height="210" fill="#F2E7D5" stroke="#994433" stroke-width="1.1"/>
  <text x="300" y="158" font-size="14" letter-spacing="2" fill="#994433">人</text>
  <line x1="300" y1="168" x2="300" y2="312" stroke="#D8CBB8" stroke-width="0.6"/>
  <text x="380" y="220" text-anchor="middle" font-size="30" letter-spacing="2" fill="#994433" font-weight="700">无良</text>
  <text x="380" y="246" text-anchor="middle" font-size="7.4" fill="#7C6D5C">良，善也；不是「没良心」</text>
  <text x="380" y="282" text-anchor="middle" font-size="8.2" fill="#1F1B17">非匹耦而从</text>
  <text x="380" y="300" text-anchor="middle" font-size="6.4" fill="#9A9186">不是配偶，却相从</text>

  <!-- 我 -->
  <rect x="510" y="126" width="200" height="210" fill="#FCFAF6" stroke="#5C544A" stroke-width="0.9"/>
  <text x="530" y="158" font-size="14" letter-spacing="2" fill="#7C6D5C">我</text>
  <line x1="530" y1="168" x2="530" y2="312" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="610" y="188" text-anchor="middle" font-size="9" fill="#994433">我以为</text>
  <rect x="540" y="202" width="64" height="56" fill="#F2E7D5" stroke="#994433" stroke-width="1"/>
  <text x="572" y="238" text-anchor="middle" font-size="24" fill="#994433" font-weight="700">兄</text>
  <rect x="616" y="202" width="64" height="56" fill="#F2E7D5" stroke="#994433" stroke-width="1"/>
  <text x="648" y="238" text-anchor="middle" font-size="24" fill="#994433" font-weight="700">君</text>
  <text x="572" y="278" text-anchor="middle" font-size="6.4" fill="#7C6D5C">公子顽</text>
  <text x="648" y="278" text-anchor="middle" font-size="6.4" fill="#7C6D5C">小君 · 宣姜</text>
  <text x="610" y="300" text-anchor="middle" font-size="6.4" fill="#9A9186">名分仍在，德已不配</text>

  <text x="380" y="366" text-anchor="middle" font-size="8.4" fill="#994433">朱子：为惠公之言以刺之</text>
  <text x="380" y="386" text-anchor="middle" font-size="6.8" fill="#9A9186">诗不名宣姜、公子顽，只让「兄」「君」两个称谓自己发烫</text>

  <rect x="80" y="406" width="600" height="44" fill="#F2E7D5" stroke="#D8CBB8" stroke-width="0.8"/>
  <text x="380" y="424" text-anchor="middle" font-size="8.6" letter-spacing="1.2" fill="#994433">鸟有常匹，人非匹耦；名分越正，耻辱越深</text>
  <text x="380" y="441" text-anchor="middle" font-size="6.2" fill="#7C6D5C">二章四句：一章称兄，二章称君</text>

  <text x="380" y="474" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#1F1B17">人之无良，我以为兄；我以为君</text>
  <text x="44" y="516" font-size="6.2" fill="#9A9186">鹑之奔奔 · 鹊之彊彊</text>
  <text x="716" y="516" text-anchor="end" font-size="6.2" fill="#9A9186">图二 · 名分与无良 · sj049b</text>
</svg>
