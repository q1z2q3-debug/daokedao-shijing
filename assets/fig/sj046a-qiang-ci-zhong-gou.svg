  <text x="614" y="248" text-anchor="middle" font-size="5.6" fill="#7C6D5C">内室</text>

  <text x="148" y="370" text-anchor="middle" font-size="7.2" fill="#994433">墙：所以防非常</text>
  <text x="148" y="386" text-anchor="middle" font-size="6.2" fill="#7C6D5C">茨蔓爬墙，扫之反伤墙</text>
  <text x="378" y="370" text-anchor="middle" font-size="7.2" fill="#994433">茨：蒺藜，子有三角刺</text>
  <text x="378" y="386" text-anchor="middle" font-size="6.2" fill="#7C6D5C">蔓生、细叶、开小黄花</text>
  <text x="614" y="370" text-anchor="middle" font-size="7.2" fill="#994433">中冓：内室，非半夜</text>
  <text x="614" y="386" text-anchor="middle" font-size="6.2" fill="#7C6D5C">堂中积材深处，闺门以内</text>

  <line x1="44" y1="414" x2="716" y2="414" stroke="#9A9186" stroke-width="0.8"/>
  <text x="380" y="450" text-anchor="middle" font-size="16" letter-spacing="3" fill="#1F1B17">墙有茨，不可扫也</text>
  <text x="380" y="474" text-anchor="middle" font-size="8.4" letter-spacing="1" fill="#7C6D5C">欲扫去之，反伤墙；中冓之言，道之伤君</text>
  <text x="44" y="506" font-size="7.2" letter-spacing="1" fill="#9A9186">外防与内隐</text>
