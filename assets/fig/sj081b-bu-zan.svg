<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
<rect width="760" height="540" fill="#F5F1E8"/>
<rect x="10" y="10" width="740" height="520" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
<rect x="22" y="28" width="716" height="470" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>
<text x="38.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.5" fill="#A63D2F" text-anchor="start" font-weight="normal" letter-spacing="2.0">郑 风 · 之七</text>
<text x="380.0" y="72.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="26.0" fill="#1F1B17" text-anchor="middle" font-weight="bold" letter-spacing="2.0">遵大路　一留</text>
<text x="720.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#7C6D5C" text-anchor="end" font-weight="normal" letter-spacing="1.0">诗三百五篇 · 之八一</text>
<line x1="38.0" y1="100.0" x2="722.0" y2="100.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="122.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.2" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="1.0">从袖口到手，从旧情到旧好</text>
<line x1="44.0" y1="196.0" x2="716.0" y2="196.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="64.0" y="176.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.5" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">一章　袪</text>
<text x="236.0" y="176.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.2" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">执子之袪 · 无我恶 · 不寁故</text>
<text x="566.0" y="176.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.6" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">初留</text>
<line x1="44.0" y1="266.0" x2="716.0" y2="266.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="64.0" y="246.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.5" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0">二章　手</text>
<text x="236.0" y="246.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.2" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">执子之手 · 无我魗 · 不寁好</text>
<text x="566.0" y="246.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.6" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">深留</text>
<line x1="44.0" y1="336.0" x2="716.0" y2="336.0" stroke="#DCD5C8" stroke-width="0.30" opacity="1.00"/>
<text x="64.0" y="316.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.5" fill="#1F1B17" text-anchor="start" font-weight="bold" letter-spacing="0.0"></text>
<text x="236.0" y="316.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.2" fill="#1F1B17" text-anchor="start" font-weight="normal" letter-spacing="0.0">两个动作，一个请求</text>
<text x="566.0" y="316.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.6" fill="#7C6D5C" text-anchor="start" font-weight="normal" letter-spacing="0.0">慢一点</text>
<line x1="206.0" y1="158.0" x2="206.0" y2="350.0" stroke="#A63D2F" stroke-width="0.55" opacity="1.00"/>
<line x1="206.0" y1="158.0" x2="214.0" y2="158.0" stroke="#A63D2F" stroke-width="0.40" opacity="1.00"/>
<line x1="206.0" y1="350.0" x2="214.0" y2="350.0" stroke="#A63D2F" stroke-width="0.40" opacity="1.00"/>
<line x1="548.0" y1="166.0" x2="548.0" y2="340.0" stroke="#7C6D5C" stroke-width="0.35" opacity="1.00"/>
<line x1="544.0" y1="166.0" x2="552.0" y2="166.0" stroke="#7C6D5C" stroke-width="0.30" opacity="1.00"/>
<line x1="544.0" y1="340.0" x2="552.0" y2="340.0" stroke="#7C6D5C" stroke-width="0.30" opacity="1.00"/>
<line x1="50.0" y1="388.0" x2="710.0" y2="388.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="414.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="12.2" fill="#A63D2F" text-anchor="middle" font-weight="bold" letter-spacing="1.0">不寁：只请慢一点</text>
<text x="380.0" y="438.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.0" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="0.5">路可同，故不可挟；手可执，好不可强。</text>
<text x="380.0" y="468.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#7C6D5C" text-anchor="middle" font-weight="normal" letter-spacing="0.0">图二 · 义理</text>
<rect x="676" y="492" width="22" height="22" fill="#A63D2F" opacity="0.13"/>
<text x="687.0" y="507.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#A63D2F" text-anchor="middle" font-weight="normal" letter-spacing="0.0">润</text>
</svg>
