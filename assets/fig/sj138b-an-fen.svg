<rect x="22" y="28" width="716" height="470" fill="none" stroke="#A0604F" stroke-width="0.8"/>
<text x="38.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.5" fill="#A63D2F" text-anchor="start" font-weight="normal" letter-spacing="2.0">陈 风 · 之三</text>
<text x="380.0" y="72.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="25.0" fill="#7A2F26" text-anchor="middle" font-weight="bold" letter-spacing="1.6">衡门　安分无求</text>
<text x="720.0" y="62.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="end" font-weight="normal" letter-spacing="1.0">诗三百五篇 · 之一百三十八</text>
<line x1="38.0" y1="100.0" x2="722.0" y2="100.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="122.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.2" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="1.0">所求有分，所安在心</text>
<line x1="44.0" y1="212.0" x2="716.0" y2="212.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">栖迟</text>
<text x="226.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">衡门之下，可以栖迟</text>
<text x="566.0" y="190.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">安</text>
<line x1="44.0" y1="282.0" x2="716.0" y2="282.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">乐饥</text>
<text x="226.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">泌之洋洋，可以乐饥</text>
<text x="566.0" y="260.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">足</text>
<line x1="44.0" y1="352.0" x2="716.0" y2="352.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<text x="62.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.4" fill="#7A2F26" text-anchor="start" font-weight="bold" letter-spacing="0.0">不必</text>
<text x="226.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="10.8" fill="#7A2F26" text-anchor="start" font-weight="normal" letter-spacing="0.0">岂其食鱼，必河之鲂鲤；岂其取妻，必齐姜宋子</text>
<text x="566.0" y="330.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="9.4" fill="#A0604F" text-anchor="start" font-weight="normal" letter-spacing="0.0">分</text>
<line x1="204.0" y1="168.0" x2="204.0" y2="352.0" stroke="#A63D2F" stroke-width="0.55" opacity="1.00"/>
<line x1="204.0" y1="168.0" x2="212.0" y2="168.0" stroke="#A63D2F" stroke-width="0.40" opacity="1.00"/>
<line x1="204.0" y1="352.0" x2="212.0" y2="352.0" stroke="#A63D2F" stroke-width="0.40" opacity="1.00"/>
<line x1="548.0" y1="176.0" x2="548.0" y2="344.0" stroke="#A0604F" stroke-width="0.35" opacity="1.00"/>
<line x1="544.0" y1="176.0" x2="552.0" y2="176.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<line x1="544.0" y1="344.0" x2="552.0" y2="344.0" stroke="#A0604F" stroke-width="0.30" opacity="1.00"/>
<line x1="50.0" y1="392.0" x2="710.0" y2="392.0" stroke="#B79A63" stroke-width="0.35" opacity="1.00"/>
<text x="380.0" y="418.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="11.6" fill="#A63D2F" text-anchor="middle" font-weight="bold" letter-spacing="0.6">衡门可栖，泌水可饥；所求有分，所安在心</text>
<text x="380.0" y="442.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="0.3">两反问只说不必求全；不画成问句人物，朱线收在「不必」一结。</text>
<text x="380.0" y="486.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.6" fill="#A0604F" text-anchor="middle" font-weight="normal" letter-spacing="0.0">图二 · 义理</text>
<rect x="676" y="492" width="22" height="22" fill="#B35142" opacity="0.13"/>
<text x="687.0" y="507.0" font-family="'Noto Serif CJK SC','Noto Serif SC','Songti SC','Source Han Serif SC',serif" font-size="8.8" fill="#B35142" text-anchor="middle" font-weight="normal" letter-spacing="0.0">润</text>
</svg>
