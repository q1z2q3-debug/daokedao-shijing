<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#9A9186" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>
  <text x="380" y="52" text-anchor="middle" font-size="21" letter-spacing="8" fill="#1F1B17" font-weight="700">立 界 与 即 界</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.6" letter-spacing="2" fill="#5C544A">《诗经》周南 · 第九篇　汉广</text>
  <defs><marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#994433"/></marker></defs>
  <rect x="70" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="145" y="206" text-anchor="middle" font-size="19" letter-spacing="0.5" fill="#5C544A" font-weight="700">不可休</text>
  <text x="145" y="248" text-anchor="middle" font-size="10" fill="#3B352F">乔木高而无荫</text>
  <text x="145" y="276" text-anchor="middle" font-size="8" fill="#9A9186">见界</text>
  <rect x="290" y="150" width="150" height="150" fill="#FCFAF6" stroke="#994433" stroke-width="1.1"/>
  <text x="365" y="206" text-anchor="middle" font-size="19" letter-spacing="0.5" fill="#994433" font-weight="700">不可泳·方</text>
  <text x="365" y="248" text-anchor="middle" font-size="10" fill="#3B352F">汉广、江永</text>
  <text x="365" y="276" text-anchor="middle" font-size="8" fill="#9A9186">认界</text>
  <rect x="510" y="150" width="150" height="150" fill="#FCFAF6" stroke="#5C544A" stroke-width="1.1"/>
  <text x="585" y="206" text-anchor="middle" font-size="19" letter-spacing="0.5" fill="#5C544A" font-weight="700">秣其马</text>
  <text x="585" y="248" text-anchor="middle" font-size="10" fill="#3B352F">刈楚、饲驹</text>
  <text x="585" y="276" text-anchor="middle" font-size="8" fill="#9A9186">界内尽力</text>
  <line x1="220" y1="225" x2="288" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar9)"/>
  <line x1="440" y1="225" x2="508" y2="225" stroke="#994433" stroke-width="1" marker-end="url(#ar9)"/>
  <text x="380" y="330" text-anchor="middle" font-size="8.4" fill="#5C544A">界不消失，人只换动作：不渡、不追，去割柴、去喂马</text>
  <line x1="120" y1="360" x2="640" y2="360" stroke="#9A9186" stroke-width="0.8"/>
  <text x="230" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">思</text>
  <text x="230" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">语辞，无义　六见</text>
  <text x="530" y="392" text-anchor="middle" font-size="13" letter-spacing="2" fill="#994433" font-weight="700">方</text>
  <text x="530" y="414" text-anchor="middle" font-size="7.4" fill="#9A9186">筏也，非「方正」</text>
  <text x="380" y="446" text-anchor="middle" font-size="7.4" fill="#9A9186">三章末四句一字不易　·　《诗》中最不肯放手的重复</text>
  <text x="120" y="512" font-size="5.6" fill="#5C544A">诗经 · 周南</text>
  <text x="640" y="512" text-anchor="end" font-size="5.6" fill="#5C544A">图二 · 立界与即界 · sj009b</text>
</svg>