<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#1F1B17" stroke-width="1.2"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#9A9186" stroke-width="0.6"/>

  <text x="380" y="52" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="19" fill="#1F1B17" letter-spacing="2">曷月予还归哉</text>
  <text x="380" y="76" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.2" fill="#7C6D5C" letter-spacing="1.2">《王风·扬之水》　三章三换，一问不变</text>
  <text x="724" y="76" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.4" fill="#9A9186">SJ068b</text>

  <rect x="40" y="100" width="680" height="380" fill="none" stroke="#DCD5C8" stroke-width="0.8"/>

  <text x="380" y="124" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.2" fill="#994433" letter-spacing="1">三章三换：物换，地换，问不变</text>

  <!-- card 1 -->
  <rect x="64" y="144" width="194" height="136" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="161" y="164" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">一章</text>
  <text x="161" y="194" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.2" fill="#1F1B17">束薪 · 戍申</text>
  <text x="161" y="218" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.2" fill="#7C6D5C">不流束薪</text>
  <text x="161" y="250" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#994433">怀哉怀哉</text>
  <line x1="161" y1="260" x2="161" y2="276" stroke="#DCD5C8" stroke-width="0.8"/>

  <!-- card 2 -->
  <rect x="283" y="144" width="194" height="136" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="380" y="164" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">二章</text>
  <text x="380" y="194" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.2" fill="#1F1B17">束楚 · 戍甫</text>
  <text x="380" y="218" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.2" fill="#7C6D5C">不流束楚</text>
  <text x="380" y="250" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#994433">怀哉怀哉</text>
  <line x1="380" y1="260" x2="380" y2="276" stroke="#DCD5C8" stroke-width="0.8"/>

  <!-- card 3 -->
  <rect x="502" y="144" width="194" height="136" fill="#FBF8F2" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="599" y="164" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">三章</text>
  <text x="599" y="194" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="9.2" fill="#1F1B17">束蒲 · 戍许</text>
  <text x="599" y="218" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.2" fill="#7C6D5C">不流束蒲</text>
  <text x="599" y="250" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7.4" fill="#994433">怀哉怀哉</text>
  <line x1="599" y1="260" x2="599" y2="276" stroke="#DCD5C8" stroke-width="0.8"/>

  <!-- arrows -->
  <path d="M161 282 L161 306 L342 306" fill="none" stroke="#994433" stroke-width="0.9" opacity="0.8"/>
  <path d="M342 306 L335 302 L335 310 Z" fill="#994433" opacity="0.8"/>
  <path d="M380 282 L380 306" fill="none" stroke="#994433" stroke-width="0.9" opacity="0.8"/>
  <path d="M599 282 L599 306 L430 306" fill="none" stroke="#994433" stroke-width="0.9" opacity="0.8"/>
  <path d="M430 306 L437 302 L437 310 Z" fill="#994433" opacity="0.8"/>

  <!-- bottom band -->
  <rect x="120" y="310" width="520" height="48" fill="#FBF8F2" stroke="#994433" stroke-width="1"/>
  <text x="380" y="330" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="7" fill="#7C6D5C">三章同问</text>
  <text x="380" y="350" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="11" fill="#994433" letter-spacing="1">曷月予还归哉？</text>

  <!-- bottom -->
  <line x1="40" y1="374" x2="720" y2="374" stroke="#DCD5C8" stroke-width="0.7"/>
  <text x="380" y="396" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="8.2" fill="#1F1B17">物换，地换，归期不换</text>
  <text x="380" y="418" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">薪→楚→蒲；申→甫→许；怀哉→怀哉→怀哉</text>
  <rect x="222" y="432" width="316" height="34" fill="none" stroke="#994433" stroke-width="1"/>
  <text x="380" y="454" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="10.6" fill="#994433" letter-spacing="1.2">归期不由己</text>

  <text x="724" y="522" text-anchor="end" font-family="Noto Serif CJK SC" font-size="6.2" fill="#9A9186">图二 · 曷月予还归哉 · sj068b</text>
</svg>
