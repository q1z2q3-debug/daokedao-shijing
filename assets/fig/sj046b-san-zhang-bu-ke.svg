  <text x="205" y="342" text-anchor="middle" font-size="24" fill="#994433">丑</text>
  <text x="205" y="357" text-anchor="middle" font-size="6.4" fill="#7C6D5C">言之丑</text>
  <rect x="330" y="312" width="150" height="52" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.9"/>
  <text x="405" y="342" text-anchor="middle" font-size="24" fill="#994433">长</text>
  <text x="405" y="357" text-anchor="middle" font-size="6.4" fill="#7C6D5C">言之长</text>
  <rect x="530" y="312" width="150" height="52" fill="#F2E7D5" stroke="#7C6D5C" stroke-width="0.9"/>
  <text x="605" y="342" text-anchor="middle" font-size="24" fill="#994433">辱</text>
  <text x="605" y="357" text-anchor="middle" font-size="6.4" fill="#7C6D5C">言之辱</text>

  <text x="205" y="390" text-anchor="middle" font-size="6.8" fill="#9A9186">墙有茨 / 中冓之言</text>
  <text x="405" y="390" text-anchor="middle" font-size="6.8" fill="#9A9186">墙有茨 / 中冓之言</text>
  <text x="605" y="390" text-anchor="middle" font-size="6.8" fill="#9A9186">墙有茨 / 中冓之言</text>

  <rect x="80" y="414" width="600" height="44" fill="#F2E7D5" stroke="#D8CBB8" stroke-width="0.8"/>
  <text x="100" y="442" font-size="6.8" letter-spacing="1" fill="#7C6D5C">三章收束</text>
  <text x="390" y="442" text-anchor="middle" font-size="13.5" letter-spacing="1.5" fill="#994433">言之丑　·　言之长　·　言之辱</text>

  <text x="380" y="478" text-anchor="middle" font-size="7.4" fill="#9A9186">三章只换字，不换事；越说「不可说」，越坐实「有」</text>
  <text x="120" y="512" font-size="5.6" fill="#5C544A">诗经 · 鄘风</text>
  <text x="640" y="512" text-anchor="end" font-size="5.6" fill="#5C544A">图二 · 三章递进 · sj046b</text>
