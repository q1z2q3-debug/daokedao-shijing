  <text x="205" y="185" text-anchor="middle" font-size="6.4" fill="#7C6D5C">不可扫</text>
  <rect x="330" y="140" width="150" height="52" fill="#F2E9DA" stroke="#5C544A" stroke-width="0.9"/>
  <text x="405" y="170" text-anchor="middle" font-size="24" fill="#1F1B17">襄</text>
  <text x="405" y="185" text-anchor="middle" font-size="6.4" fill="#7C6D5C">不可襄</text>
  <rect x="530" y="140" width="150" height="52" fill="#F2E9DA" stroke="#5C544A" stroke-width="0.9"/>
  <text x="605" y="170" text-anchor="middle" font-size="24" fill="#1F1B17">束</text>
  <text x="605" y="185" text-anchor="middle" font-size="6.4" fill="#7C6D5C">不可束</text>

  <line x1="205" y1="194" x2="205" y2="223" stroke="#994433" stroke-width="1" marker-end="url(#ar046)"/>
  <line x1="405" y1="194" x2="405" y2="223" stroke="#994433" stroke-width="1" marker-end="url(#ar046)"/>
  <line x1="605" y1="194" x2="605" y2="223" stroke="#994433" stroke-width="1" marker-end="url(#ar046)"/>

  <rect x="130" y="226" width="150" height="52" fill="#FCFAF6" stroke="#994433" stroke-width="1.0"/>
