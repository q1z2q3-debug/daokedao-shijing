  <text x="380" y="50" text-anchor="middle" font-size="20" letter-spacing="4" fill="#1F1B17" font-weight="700">三章递进：从手到口</text>
  <text x="380" y="72" text-anchor="middle" font-size="9.2" letter-spacing="2" fill="#5C544A">《诗经》鄘风 · 第二篇　墙有茨</text>
  <defs><marker id="ar046" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#994433"/></marker></defs>

  <text x="70" y="176" text-anchor="middle" font-size="8" fill="#7C6D5C">手</text>
  <text x="70" y="246" text-anchor="middle" font-size="8" fill="#7C6D5C">口</text>
  <text x="70" y="316" text-anchor="middle" font-size="8" fill="#7C6D5C">果</text>
  <line x1="96" y1="150" x2="96" y2="336" stroke="#DCD5C8" stroke-width="0.7"/>

  <text x="205" y="124" text-anchor="middle" font-size="8.4" fill="#994433">一章</text>
