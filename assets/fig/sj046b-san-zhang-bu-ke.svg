  <text x="405" y="256" text-anchor="middle" font-size="24" fill="#994433">详</text>
  <text x="405" y="271" text-anchor="middle" font-size="6.4" fill="#7C6D5C">不可详</text>
  <rect x="530" y="226" width="150" height="52" fill="#FCFAF6" stroke="#994433" stroke-width="1.0"/>
  <text x="605" y="256" text-anchor="middle" font-size="24" fill="#994433">读</text>
  <text x="605" y="271" text-anchor="middle" font-size="6.4" fill="#7C6D5C">不可读</text>

