  <text x="60" y="414" font-size="7.8" fill="#5C544A">① 雎鸠　生有定偶，并游而不相狎</text>
  <text x="420" y="414" font-size="7.8" fill="#5C544A">② 荇菜　圆叶细茎，可为菹　③ 洲　水中可居</text>
